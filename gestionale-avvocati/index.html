<style>
:root{--paper:#f6f2ea;--card:#fffdf8;--ink:#1d2331;--mut:#7a7366;--line:#e7dfcf;--line2:#efe9dd;--navy:#15213a;--navy2:#22335a;--gold:#a8864a;--gold2:#c9a96a;--bord:#7c2633;--ok:#3e6a50;--warn:#9a6b17;--bad:#8f2a35;--okbg:#eaf1ec;--warnbg:#f8f0de;--badbg:#f6e7e8;--pill:#f1ece2;--serif:'Cormorant Garamond',Garamond,'Times New Roman',serif;--sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#11161f;--card:#181f2b;--ink:#ece6da;--mut:#a39b8c;--line:#2b3343;--line2:#232b39;--navy:#0b1220;--navy2:#1b2740;--gold:#c9a96a;--gold2:#dcc28b;--okbg:#18291f;--warnbg:#2e2614;--badbg:#311a1d;--pill:#232b39;--ok:#7fb393;--warn:#d9b062;--bad:#e08a92}}
*{box-sizing:border-box}h2,h3,.kpi b,.row .d,.rg,.day b,dialog h3{font-variant-numeric:lining-nums}
body{margin:0;font:14px/1.55 var(--sans);background:var(--paper);color:var(--ink);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* sidebar */
nav{width:248px;background:var(--navy);color:#c9cfdb;padding:28px 18px 18px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:12px;align-items:center;margin:0 6px 30px;padding-bottom:22px;border-bottom:1px solid #ffffff14}
.mono{width:46px;height:46px;font-size:15px!important;border:1px solid var(--gold2);color:var(--gold2);display:grid;place-items:center;font-family:var(--serif);font-weight:600;letter-spacing:0;border-radius:50%}
.brand b{display:block;font:600 19px/1.1 var(--serif);color:#f3ede1;letter-spacing:.01em}.brand small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
nav .sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#7d879b;margin:4px 12px 8px}
nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:4px;color:inherit;text-decoration:none;cursor:pointer;font-size:13.5px;border-left:2px solid transparent;transition:background .15s,color .15s}
nav a:hover{background:#ffffff0a;color:#fff}nav a.on{background:#ffffff0f;color:#fff;border-left-color:var(--gold2)}nav a.on svg{color:var(--gold2)}
nav a .n{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:10px;font-size:10.5px;font-weight:600;padding:1px 7px}
nav .me{margin-top:auto;padding:16px 8px 0;border-top:1px solid #ffffff14}nav .me label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#7d879b}
nav select{width:100%;margin-top:6px;background:#ffffff0d;border:1px solid #ffffff1f;color:#f3ede1;border-radius:4px;padding:8px}nav select option{color:#111}
/* main */
main{flex:1;padding:44px 52px;min-width:0;max-width:1240px}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 6px;font-weight:500}
h2{margin:0;font:600 36px/1.1 var(--serif);letter-spacing:.005em}
.sub{color:var(--mut);margin:8px 0 30px;font-size:14px}
.rule{height:1px;background:linear-gradient(90deg,var(--gold) 0 56px,var(--line) 56px);margin:0 0 30px}
.grid{display:grid;gap:22px}.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 24px;box-shadow:0 1px 2px #15213a08}
.card h3 .tag{font:500 11px var(--sans)}.card h3{margin:0 0 14px;font:600 20px/1.2 var(--serif);display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpi{padding:20px 22px;position:relative}.kpi span{color:var(--mut);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.kpi b{font:500 28px/1.2 var(--sans);letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:block;margin-top:8px}.kpi.alert b{color:var(--bord)}.kpi.good b{color:var(--ok)}
.kpi:before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:2px;background:var(--gold);opacity:.7}
/* controlli */
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:4px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;transition:all .15s}
button:hover{border-color:var(--gold);color:var(--ink)}
button.p{background:var(--navy);color:#f5efe3;border-color:var(--navy)}button.p:hover{background:var(--navy2);border-color:var(--gold)}
@media(prefers-color-scheme:dark){button.p{background:var(--gold);color:#111;border-color:var(--gold)}button.p:hover{background:var(--gold2)}}
button.s{padding:4px 10px;font-size:12px}button.ic{padding:5px 7px;border-color:transparent;background:transparent;color:var(--mut)}button.ic:hover{color:var(--gold);border-color:var(--line)}
button.d{color:var(--bad)}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:9px 11px;width:100%;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #a8864a1f}
input[type=checkbox]{accent-color:var(--navy);width:16px;height:16px}
.search{position:relative;max-width:300px;flex:1}.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mut)}.search input{padding-left:34px}

.tbl{overflow-x:auto;padding:6px 0}.tbl h3{padding:16px 24px 0}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--mut);font-weight:500;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}tbody tr,table tr{transition:background .12s}table tr:hover td{background:#a8864a08}
td.r,th.r{text-align:right}td:first-child,th:first-child{padding-left:24px}td:last-child,th:last-child{padding-right:20px}
td small{display:block;color:var(--mut);font-size:12px}
.rg{font-weight:600;font-variant-numeric:tabular-nums;color:var(--navy)}@media(prefers-color-scheme:dark){.rg{color:var(--gold2)}}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.bar .sp{flex:1}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500;background:var(--pill);color:var(--mut);white-space:nowrap;letter-spacing:.02em}
.t-bad{background:var(--badbg);color:var(--bad)}.t-warn{background:var(--warnbg);color:var(--warn)}.t-ok{background:var(--okbg);color:var(--ok)}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}.row:last-child{border:0}
.row .d{min-width:52px;font:600 13px var(--sans);color:var(--gold);font-variant-numeric:tabular-nums}.row .x{flex:1;min-width:0}.row small{color:var(--mut);display:block;font-size:12px;margin-top:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--card)}.seg button{border:0;border-radius:0;padding:8px 15px;border-right:1px solid var(--line)}.seg button:last-child{border-right:0}

.day{display:flex;align-items:baseline;gap:12px;margin:22px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--line)}.day:first-child{margin-top:0}

.done{text-decoration:line-through;color:var(--mut)}
.prog{background:var(--line2);border-radius:2px;height:5px}.prog div{height:5px;border-radius:2px;background:var(--gold)}
dialog{border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);width:min(500px,94vw);padding:30px 32px;box-shadow:0 24px 60px #0003}
dialog::backdrop{background:#15213a99;backdrop-filter:blur(2px)}dialog h3{font:600 26px var(--serif);margin:0 0 4px}
dialog label{display:block;margin:14px 0 5px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
/* assistente */
#botbtn{position:fixed;right:28px;bottom:28px;border-radius:30px;padding:13px 22px;box-shadow:0 10px 30px #15213a40;z-index:5;border:1px solid var(--gold);font-size:13px;letter-spacing:.04em}
#bot{position:fixed;right:28px;bottom:88px;width:min(400px,94vw);height:min(560px,72vh);display:none;flex-direction:column;z-index:5;padding:0;box-shadow:0 24px 60px #15213a40;overflow:hidden}
#bot.open{display:flex}#bot header{padding:18px 22px;background:var(--navy);color:#f3ede1;border-bottom:1px solid var(--gold)}
#bot header b{font:600 20px var(--serif);display:block}#bot header small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
#msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.m{max-width:88%;padding:10px 14px;border-radius:4px 14px 14px 14px;background:var(--card);border:1px solid var(--line);white-space:pre-wrap;font-size:13.5px}
.m.u{align-self:flex-end;background:var(--navy);color:#f5efe3;border-color:var(--navy);border-radius:14px 4px 14px 14px}
.m dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 10px}.m dt{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding-top:2px}.m dd{margin:0}
#bot form{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--card)}
.hint{font-size:11.5px;color:var(--mut);padding:10px 16px;border-top:1px solid var(--line);background:var(--card);font-style:italic}
.empty{color:var(--mut);padding:14px 0;font-style:italic}
@media(max-width:820px){body{flex-direction:column}nav{width:100%;height:auto;position:static;padding:16px}.brand{margin-bottom:12px;padding-bottom:12px}nav .sec{display:none}nav .links{display:flex;flex-wrap:wrap;gap:2px}nav a{padding:7px 10px}nav .me{margin-top:10px}main{padding:26px 16px}h2{font-size:30px}#botbtn{right:16px;bottom:16px}#bot{right:3vw;bottom:76px}}

</head>

function openForm(title,fields,vals,onSave,onDelete){
 const d=$('#dlg');
 d.innerHTML=`<form method="dialog"><h3 style="margin:0 0 6px">${esc(title)}</h3>${fields.map(f=>{
  const v=vals?.[f.k]??f.def??'';let inp;
  if(f.t==='select')inp=`<select name="${f.k}">${f.opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return`<option value="${esc(val)}" ${val==v?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
  else if(f.t==='check')inp=`<input type="checkbox" name="${f.k}" style="width:auto" ${v?'checked':''}>`;
  else if(f.t==='area')inp=`<textarea name="${f.k}" rows="2">${esc(v)}</textarea>`;
  else inp=`<input name="${f.k}" type="${f.t||'text'}" ${f.step?`step="${f.step}"`:''} value="${esc(v)}" ${f.req?'required':''}>`;
  return`<label>${esc(f.l)}</label>${inp}`}).join('')}
  <div class="bar" style="margin:16px 0 0"><button class="p" value="ok">Salva</button><button value="x" formnovalidate>Annulla</button><span class="sp"></span>${onDelete?'<button class="d" value="del" formnovalidate>Elimina</button>':''}</div></form>`;
 d.onclose=()=>{
  if(d.returnValue==='del'&&onDelete&&confirm('Eliminare definitivamente?')){onDelete();save();render();}
  else if(d.returnValue==='ok'){const o={};fields.forEach(f=>{const el=d.querySelector(`[name="${f.k}"]`);o[f.k]=f.t==='check'?el.checked:f.t==='number'?parseFloat(el.value||0):el.value});onSave(o);save();render();}
  d.returnValue='';};
 d.showModal();
}

function upcomingDeadlines(){
 const L=[];
 DB.events.filter(e=>(e.shared||e.owner===me)&&['Scadenza','Udienza'].includes(e.type)&&diff(e.date)<=14&&diff(e.date)>=0).forEach(e=>L.push({date:e.date,txt:e.title,kind:e.type,sub:e.shared?'Studio':'Riservato'}));
 DB.todos.filter(t=>t.owner===me&&!t.done&&t.due&&diff(t.due)<=14).forEach(t=>L.push({date:t.due,txt:t.text,kind:'To-do',sub:'Riservato'}));

 ${list.map(h=>`<tr><td>${fIt(h.date)}</td><td>${esc(uName(h.user))}</td><td>${esc(h.pratica?pLabel(h.pratica):'Attività generale')}</td><td>${esc(h.desc)}</td><td class="r">${h.ore}</td><td><button class="ic" title="Modifica" onclick="editOre('${h.id}')">${ic('edit')}</button></td></tr>`).join('')}</table></div>`;
}
window.editOre=id=>{const h=id?DB.hours.find(x=>x.id===id):null;openForm(h?'Modifica ore':'Registra ore',[{k:'user',l:'Collaboratore',t:'select',opts:optUsers,def:me},{k:'date',l:'Data',t:'date',def:isoOff(0),req:1},{k:'ore',l:'Ore',t:'number',step:'0.25',req:1,def:1},{k:'pratica',l:'Pratica',t:'select',opts:optPrat},{k:'desc',l:'Attività'}],h,o=>{if(h)Object.assign(h,o);else DB.hours.push({id:uid(),...o})},h&&(()=>DB.hours=DB.hours.filter(x=>x!==h)))};

/* ============ render ============ */
const VIEWS={dash:vDash,agenda:vAgenda,todo:vTodo,fatture:vFatture,registro:vRegistro,rubrica:vRubrica,ore:vOre};
function render(keepFocus){
 const late=DB.invoices.filter(i=>!i.pagata&&diff(i.scadenza)<0).length;
 const urgent=upcomingDeadlines().filter(x=>diff(x.date)<=1&&x.kind!=='Fattura').length;
 $('#nav').innerHTML=`<div class="brand"><div class="mono">R&amp;A</div><div><b>Rossi &amp; Associati</b><small>Studio Legale</small></div></div><div class="sec">Studio</div><div class="links">${PAGES.map(([k,l])=>`<a class="${page===k?'on':''}" onclick="go('${k}')">${ic(k)}<span>${l}</span>${k==='dash'&&urgent?`<span class="n">${urgent}</span>`:''}${k==='fatture'&&late?`<span class="n">${late}</span>`:''}</a>`).join('')}</div>
 <div class="me"><label>Utente attivo</label><select onchange="me=this.value;try{localStorage.setItem(KEY+'-me',me)}catch{};render()">${USERS.map(u=>`<option value="${u.id}" ${u.id===me?'selected':''}>${u.nome}</option>`).join('')}</select></div>`;
 $('#main').innerHTML=VIEWS[page]();
 if(keepFocus){const i=$('#qin');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
}
window.go=k=>{page=k;q='';render();scrollTo(0,0)};

/* ============ BOT (parser linguaggio naturale italiano) ============ */
const msgs=$('#msgs');
function say(t,u,html){const d=document.createElement('div');d.className='m'+(u?' u':'');html?d.innerHTML=t:d.textContent=t;msgs.appendChild(d);msgs.scrollTop=1e9;return d}
function parseCmd(raw){
 let s=' '+raw.toLowerCase()+' ',cut=[];const take=m=>{if(m)cut.push(m[0]);return m};
 let date=null,time='';
 let m;
 if(take(m=s.match(/\bdopodomani\b/)))date=isoOff(2);
 else if(take(m=s.match(/\bdomani\b/)))date=isoOff(1);
 else if(take(m=s.match(/\boggi\b/)))date=isoOff(0);
 else if(take(m=s.match(/\btra (\d+) (giorn[oi]|settiman[ae]|mesi|mese)\b/))){const n=+m[1],u=m[2][0];date=iso(u==='g'?addD(n):u==='s'?addD(n*7):(()=>{const d=new Date(T0);d.setMonth(d.getMonth()+n);return d})())}
 else if(take(m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){let y=m[3]?+m[3]:T0.getFullYear();if(y<100)y+=2000;let d=new Date(y,m[2]-1,+m[1]);if(!m[3]&&d<T0)d.setFullYear(y+1);date=iso(d)}
 else if(take(m=s.match(new RegExp(`\\b(\\d{1,2}) (${MESI.join('|')})(?: (\\d{4}))?\\b`)))){let y=m[3]?+m[3]:T0.getFullYear();let d=new Date(y,MESI.indexOf(m[2]),+m[1]);if(!m[3]&&d<T0)d.setFullYear(y+1);date=iso(d)}
 else if(take(m=s.match(/\b(lunedi|lunedì|martedi|martedì|mercoledi|mercoledì|giovedi|giovedì|venerdi|venerdì|sabato|domenica)(?![a-zà-ù])(?: prossimo)?/))){const w=GIORNI.findIndex(g=>g.normalize('NFD').replace(/\p{M}/g,'')===m[1].normalize('NFD').replace(/\p{M}/g,''));let n=(w-T0.getDay()+7)%7||7;date=iso(addD(n))}
 else if(take(m=s.match(/\bprossima settimana\b/)))date=iso(addD(7));
 if(take(m=s.match(/\b(?:alle|ore|h)\s*(\d{1,2})(?:[:.](\d{2}))?\b/))||take(m=s.match(/\b(\d{1,2}):(\d{2})\b/)))time=`${p2(m[1])}:${m[2]||'00'}`;
 const personal=!!take(s.match(/\b(personale|privato|privata|mio|mia)\b/));
 let type='Appuntamento',todo=false;
 if(/udienza/.test(s))type='Udienza';else if(/scadenza|termine|deposit/.test(s))type='Scadenza';else if(/riunione/.test(s))type='Riunione';
 if(/ricordami|promemoria|to-?do|da fare|devo /.test(s))todo=true;
 const cl=DB.clients.find(c=>{const n=c.nome.toLowerCase();return s.includes(n)||n.split(/\s+/).some(w=>w.length>3&&!['s.r.l.','s.p.a.','costruzioni','logistica'].includes(w)&&s.includes(' '+w))});
 const rg=(s.match(/\brg\s*(?:n\.?\s*)?(\d+\/\d{2,4})/)||[])[1];
 let title=raw;cut.forEach(c=>{title=title.replace(new RegExp(c.trim().replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),'')});
 title=title.replace(/^\s*(crea|aggiungi|inserisci|fissa|metti|segna)(\s+(un|una|l'|lo|la))?\s*(evento|appuntamento|promemoria)?\s*/i,'').replace(/^\s*(ricordami|ricorda)\s*(di|che)?\s*/i,'').replace(/\s+(il|in data|per il|alle|di|a|per)\s*$/i,'').replace(/\s{2,}/g,' ').trim();
 title=title.charAt(0).toUpperCase()+title.slice(1);
 return{title,date,time,type,todo,personal,client:cl,rg};
}
let pending=null;
function handle(text){
 say(text,true);const l=text.toLowerCase();
 if(/cosa scade|scadenz[ae].*(settimana|prossim|imminent)|^scadenze|cosa ho|agenda/.test(l)&&!/\d{1,2}\/\d|^(crea|aggiungi|inserisci|fissa)/.test(l)&&!parseCmd(text).date){
  const lim=/oggi/.test(l)?0:/settimana/.test(l)?7:14;
  const L=upcomingDeadlines().filter(x=>diff(x.date)<=lim);
  return say(L.length?`Prossimi ${lim===0?'impegni di oggi':lim+' giorni'}:\n`+L.map(x=>`• ${fIt(x.date).slice(0,5)} – ${x.txt} (${when(x.date)})`).join('\n'):'Nessuna scadenza nel periodo indicato.');}
 if(/fatture (scadute|da incassare|aperte)/.test(l)){const L=DB.invoices.filter(i=>!i.pagata&&(l.includes('scadute')?diff(i.scadenza)<0:true));return say(L.length?L.map(i=>`• ${i.num} ${cName(i.clientId)} – ${eur(i.importo)} (scad. ${fIt(i.scadenza)})`).join('\n'):'Nessuna fattura.')}
 const r=parseCmd(text);
 if(!r.date&&!r.todo)return say('Non ho trovato una data. Prova con «domani», «lunedì», «15/12» o «tra 3 giorni».');
 if(!r.title)return say('Mi manca un titolo per l’evento.');
 pending=r;const kind=r.todo?'Attività personale':`${r.type} · ${r.personal?'agenda riservata':'agenda di studio'}`;
 const el=say(`Desidera che registri quanto segue?<dl><dt>Oggetto</dt><dd>${esc(r.title)}</dd><dt>Tipo</dt><dd>${kind}</dd><dt>Data</dt><dd>${r.date?fLong(r.date)+(r.time?', ore '+r.time:''):'senza scadenza'}</dd>${r.client?`<dt>Cliente</dt><dd>${esc(r.client.nome)}</dd>`:''}${r.rg?`<dt>RG</dt><dd>${esc(r.rg)}</dd>`:''}</dl><button class="s p" id="okb">Conferma</button> <button class="s" id="nob">Annulla</button>`,false,true);
 el.querySelector('#okb').onclick=()=>{const x=pending;if(!x)return;
  if(x.todo)DB.todos.push({id:uid(),text:x.title,owner:me,due:x.date||'',done:false});
  else DB.events.push({id:uid(),title:x.title,date:x.date,time:x.time,type:x.type,owner:me,shared:!x.personal,clientId:x.client?.id||'',note:x.rg?'RG '+x.rg:''});
  pending=null;save();render();el.querySelector('#okb').parentNode.querySelectorAll('button').forEach(b=>b.remove());say('Registrato. Lo trova in '+(x.todo?'Attività':'Agenda')+'.')};
 el.querySelector('#nob').onclick=()=>{pending=null;el.querySelectorAll('button').forEach(b=>b.remove());say('Annullato.')};
}
$('#botbtn').onclick=()=>{$('#bot').classList.toggle('open');if(!msgs.children.length)say('Buongiorno. Mi indichi pure l’impegno da annotare, ad esempio:\n«udienza Ferrari domani alle 10»\n«scadenza memoria Esposito il 15/12»\n«ricordami di chiamare Conti venerdì»');$('#botin').focus()};
$('#botform').onsubmit=e=>{e.preventDefault();const v=$('#botin').value.trim();if(v){$('#botin').value='';handle(v)}};
render();
</script>
