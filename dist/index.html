      const findPhone=()=>{
        // prefer office phone, then generic, then alternative
        return find('telefono ufficio','phone office','tel ufficio')||find('telefono','phone','tel ','cellulare','mobile','cell')||keys.find(k=>/tel|phone/i.test(k));
      };
      let companyKey=find('azienda','company','ragione','societ','cliente','account','ditta','denominazione');
      const contactKey=find('contatto','contact','referente','persona','nominativo','incaricato');
      const nameKey=find('nome','name');
      // if no explicit company column, the Nome/Name column IS the company
      if(!companyKey)companyKey=nameKey;
      const phoneKey=findPhone();
      const altPhoneKey=find('alternativ','secondario','mobile','cellulare');
      const emailKey=find('email','e-mail','mail');
      const roleKey=find('ruolo','role','posizione','titolo','qualifica');
      const addrKey=find('indirizzo','address','sede','città','citta','city');
      const g=(r,k)=>k?norm(r[k]):'';

        company:g(r,companyKey),
        contact:contactKey&&contactKey!==companyKey?g(r,contactKey):'',
        role:g(r,roleKey),
        email:g(r,emailKey),
        phone:g(r,phoneKey)||g(r,altPhoneKey),
        address:g(r,addrKey)

function parseRegistryRows(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const findSheet=(names)=>{for(const n of wb.SheetNames){if(names.some(x=>n.toLowerCase().includes(x)))return n;}return wb.SheetNames[0];};
  const sheet=wb.Sheets[findSheet(['offert','offer','registro'])];
  const rows=sheetRows(sheet,['progressivo','numero_offerta','numero offerta','prog']);
  const out=rows.map(r=>{
    const g=(...k)=>{for(const key of Object.keys(r)){const kl=key.toLowerCase();if(k.some(x=>kl.includes(x)))return r[key];}return '';};
    return {prog:g('progressivo','prog'),num:g('numero_offerta','numero offerta','offerta'),
      date:g('data','date'),client:g('cliente','client'),rep:g('referente','rep'),
      total:g('totale','total'),
      machine:g('macchina','machine'),
      addedOptionals:g('optional_aggiunti','added_optionals'),note:g('note','notes'),
      status:g('stato'),outcomeDate:g('data_esito'),wonValue:g('valore_vinto'),validity:g('validita')};
  }).filter(r=>r.prog||r.num);
  // dettaglio macchine per offerta (foglio "Righe"): serve alle statistiche macchine della dashboard
  const sr=wb.SheetNames.find(n=>/righe|lines|dettaglio/i.test(n));
  if(sr){
    const by={};
    sheetRows(wb.Sheets[sr],['numero_offerta']).forEach(x=>{
      const num=String(x.Numero_Offerta||'').trim();if(!num)return;
      (by[num]=by[num]||[]).push({code:String(x.Codice||''),name:String(x.Nome||''),category:String(x.Categoria||''),
        qty:Number(x.Qta)||1,value:x.Valore_EUR===''?null:Number(x.Valore_EUR),pkg:Number(x.Pacchetto)||1,won:/^s/i.test(String(x.Venduta||''))});
    });
    out.forEach(r=>{const k=String(r.num).trim();if(by[k])r.lines=by[k];});
  }
  return out;
}
function handleRegistry(e){
  const file=e.target.files[0];if(!file)return;

async function ensureRegistryHandle(){

function buildRegistryBlob(){
  const header=['Progressivo','Numero_Offerta','Data','Cliente','Referente','Totale_EUR','Macchina_Offerta','Optional_Aggiunti','Note','Stato','Data_Esito','Valore_Vinto','Validita_Giorni'];

  const rig=[['Numero_Offerta','Pacchetto','Codice','Nome','Categoria','Qta','Valore_EUR','Venduta']];

async function writeRegistryEntry(){
  const mkNum=p=>BRAND.offerPrefix+String(yr).slice(2)+'-'+String(p).padStart(3,'0');
  await ensureRegistryHandle();
  if(GH.ok)await ghRefresh();                          // numero progressivo globale (tutti i commerciali)
  const linked=await reloadRegistry();               // pull colleagues' latest numbers if the file is shared
  // a recalled offer already carries its own "<original>_REVn" number (see doRecall) —
  // keep it as-is instead of assigning a fresh progressive one
  const isRevision=!!S.isRevisionOffer||/_REV\d+$/i.test(String(S.offerNum||''));
  let prog,num,used=new Set(REGISTRY.rows.map(r=>String(r.num).trim()));
  if(isRevision){
    num=S.offerNum;
    const m=String(num).match(/^[A-Z]+-\d{2}-(\d+)_REV\d+$/i);
    prog=m?parseInt(m[1],10):nextProgressivo();
  }else{
    // assign the first free number based on the freshest data
    prog=nextProgressivo();
    num=mkNum(prog);
    while(used.has(num)){prog++;num=mkNum(prog);}
  }
  const {grand}=lineTotals();
  const machineSummary=S.solutions.map(s=>`${s.code||''} (${s.name||''})${s.qty>1?' x'+s.qty:''}`).join(' | ');
  const addedOptSummary=S.solutions.map(s=>{
    const acc=(s.accessories||[]).filter(a=>a.code||a.desc);
    return acc.length?`[${s.code}] `+acc.map(a=>a.desc?`${a.code||''} - ${a.desc}`.replace(/^ - /,''):a.code).join('; '):'';
  }).filter(Boolean).join(' || ');
  const row={prog,num,date:S.date,client:S.client,rep:S.rep.name,total:Number(grand.toFixed(2)),
    machine:machineSummary,addedOptionals:addedOptSummary,note:'',validity:String(S.validity||'30'),lang:LANG,status:'open',outcomeDate:'',wonValue:'',lines:offerLinesFromState()};
  REGISTRY.rows.push(row);S.offerNum=num;persistRegistryLocal();
  let ghSaved=false;
  const snapshot={__yachtOffer:true,baseOfferNum:String(num).replace(/_REV\d+$/i,''),savedAt:new Date().toISOString(),lang:LANG,state:JSON.parse(JSON.stringify(S))};
  if(GH.ok){
    try{
      const r=await ghSaveOffer(row,snapshot);ghSaved=!!r.saved;num=row.num;prog=row.prog;S.offerNum=num;persistRegistryLocal();
    }catch(e){console.error(e);flash('GitHub: offerta NON salvata ('+e.message+')');}
  }
  rememberSnapshotLocal(num,snapshot);                 // copia locale: l'offerta si può richiamare anche senza GitHub
  let saved=await writeRegistryBack();
  if(!saved&&ghSaved)saved=true;                       // salvata su GitHub anche senza cartella collegata
  if(!saved) saved=await ensureRegistryHandleAndWrite();
  // guard against a same-moment race: re-read; if our number ended up duplicated, take the next free one and rewrite
  if(saved&&linked){
    try{
      if(await reloadRegistry()){
        const dup=REGISTRY.rows.filter(r=>String(r.num).trim()===num).length;
        const mine=REGISTRY.rows.some(r=>String(r.num).trim()===num&&String(r.client).trim()===String(S.client).trim());
        if(dup>1||!mine){
          used=new Set(REGISTRY.rows.map(r=>String(r.num).trim()));
          if(isRevision){
            const base=String(S.offerNum).replace(/_REV\d+$/i,'');
            let rev=1;while(used.has(base+'_REV'+rev))rev++;
            num=base+'_REV'+rev;
          }else{
            prog=nextProgressivo();num=mkNum(prog);while(used.has(num)){prog++;num=mkNum(prog);}
          }
          row.prog=prog;row.num=num;S.offerNum=num;REGISTRY.rows.push(row);persistRegistryLocal();
          await writeRegistryBack();
        }
      }
    }catch(_){}
  }
  return {saved,num,row,ghSaved};
}
// single button: generate + save the PDF, register the offer number in the registry file,
// persist the client's data, then reset the form for the next offer (only after everything succeeded)
// reopen a previously saved offer by choosing its PDF from the "Offerte fatte" folder;
// the structured data needed to restore all fields is read from the companion file saved alongside it (same name)
async function recallOffer(){
  let dir;
  try{ dir=await getSaveDir(); }catch(e){ flash(t('recall_err')); return; }
  const pdfs=[];
  try{
    for await(const [name,entry] of dir.entries()){
      if(entry.kind==='file'&&/\.pdf$/i.test(name))pdfs.push(name);
    }
  }catch(e){ console.error(e); flash(t('recall_err')); return; }
  if(!pdfs.length){ flash(t('recall_none')); return; }
  pdfs.sort((a,b)=>b.localeCompare(a));
  showRecallPicker(pdfs,dir);
}
function showRecallPicker(pdfs,dir){
  const old=document.getElementById('recallOverlay');if(old)old.remove();
  const o=document.createElement('div');

    <div class="load-status">${t('recall_pick_hint')}</div>

    <div id="recallList" style="display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:44vh;overflow:auto"></div>
    <button class="btn ghost" id="recallCancel" style="margin-top:14px;width:100%">${t('cancel')}</button>
  </div>`;
  document.body.appendChild(o);
  const list=o.querySelector('#recallList');

      const d=document.createElement('div');d.style.cssText='color:#8592a8;font-size:12.5px;padding:8px 2px';

    }
    shown.forEach(name=>{
      const b=document.createElement('button');
      b.className='btn nav';b.style.textAlign='left';
      b.textContent=name.replace(/\.pdf$/i,'');

// Shared restore logic: takes the parsed contents of a saved offer .json file and
// applies it to the live state S — used both by the folder-based recall (doRecall)
// and by the direct drag&drop / file-picker upload (restoreOfferFromUpload).
async function restoreOfferData(data,forcedBaseNum){
  if(!data||!data.__yachtOffer||!data.state){ hideLoader(); flash(t('recall_invalid')); return false; }
  const st=data.state;
  Object.keys(S).forEach(k=>delete S[k]);
  Object.assign(S,st);
  // lingua dell'offerta: il documento si riapre nella stessa lingua in cui era stato fatto
  if(data.lang&&I18N[data.lang]){LANG=data.lang;try{$('#langSel').value=LANG;document.documentElement.lang=LANG;}catch(_){}}
  // stored photos were session-only blob URLs and don't survive — clear them, then try to
  // re-fetch them by code from the currently linked images folder (same lookup used on folder link)
  S.solutions=(st.solutions||[]).map(s=>({...s,img:'',imgs:[],accessories:(s.accessories||[]).map(a=>({...a,img:''}))}));
  S.solutions.forEach(s=>{
    const u=imgUrlForCode(s.code);
    if(u){s.img=u;ensureImgs(s);if(!s.imgs.length)s.imgs.push(u);}
    s.accessories.forEach(a=>{const au=imgUrlForCode(a.code);if(au)a.img=au;});
  });
  const baseNum=String(forcedBaseNum||data.baseOfferNum||st.offerNum||'').replace(/_REV\d+$/i,'');
  try{ await ensureRegistryHandle(); }catch(_){}
  let maxRev=0;
  try{
    await reloadRegistry();
    const escNum=baseNum.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp('^'+escNum+'_REV(\\d+)$','i');
    REGISTRY.rows.forEach(r=>{const m=String(r.num||'').match(re);if(m)maxRev=Math.max(maxRev,parseInt(m[1],10));});
  }catch(_){}
  S.offerNum=baseNum+'_REV'+(maxRev+1);
  S.isRevisionOffer=true;
  step=0;maxReached=0;
  hideLoader();
  flash(t('offer_recalled').replace('%n',S.offerNum));
  render();
  return true;
}
// upload path: read a .json file the user drops or picks directly, no folder/PDF matching needed
// pulls just the "DPC-26-164" prefix out of a saved offer's file name, ignoring any
// existing _REVn suffix or trailing client-name segment — this is always taken as the
// source of truth for which offer is being revised, instead of trusting a field stored
// inside the JSON payload (which could in principle be stale or mismatched)
function extractBaseNumFromFilename(name){
  const base=String(name||'').replace(/\.(json|pdf)$/i,'');
  const m=base.match(/^([A-Z]+-\d{2}-\d+)/i);
  return m?m[1]:'';
}
function restoreOfferFromUpload(file){
  showLoader(t('recall_offer'));setLoader(-1,t('reading_folder'));
  const forcedBaseNum=extractBaseNumFromFilename(file.name);
  const r=new FileReader();
  r.onload=async ev=>{
    let data;
    try{ data=JSON.parse(ev.target.result); }
    catch(_){ hideLoader(); flash(t('recall_invalid')); return; }
    await restoreOfferData(data,forcedBaseNum);
  };
  r.onerror=()=>{ hideLoader(); flash(t('recall_err')); };
  r.readAsText(file);
}

async function loadFromDir(h){

function addCanvasPaged(pdf,canvas,first,q){
  q=q||0.92;
  const pw=210, ph=297;
  const imgH=canvas.width? canvas.height*pw/canvas.width : ph;
  if(imgH<=ph+0.6){ if(!first)pdf.addPage(); pdf.addImage(canvas.toDataURL('image/jpeg',q),'JPEG',0,0,pw,imgH); return; }
  const pageHpx=Math.floor(canvas.width*ph/pw); let y=0, pnum=0;
  while(y<canvas.height){
    const sliceH=Math.min(pageHpx,canvas.height-y);
    const c=document.createElement('canvas');c.width=canvas.width;c.height=sliceH;
    c.getContext('2d').drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
    if(!(first&&pnum===0))pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg',q),'JPEG',0,0,pw,sliceH*pw/canvas.width);
    y+=sliceH; pnum++;
  }

async function svgToImg(svg,scale){
  const rect=svg.getBoundingClientRect();
  const w=Math.max(1,Math.round(rect.width))||100, h=Math.max(1,Math.round(rect.height))||100;
  const clone=svg.cloneNode(true);
  clone.setAttribute('width',w);clone.setAttribute('height',h);
  if(!clone.getAttribute('xmlns'))clone.setAttribute('xmlns','http://www.w3.org/2000/svg');
  const svgStr=new XMLSerializer().serializeToString(clone);
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(w*scale));canvas.height=Math.max(1,Math.round(h*scale));
  canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);
  const img=document.createElement('img');
  img.src=canvas.toDataURL('image/png');
  img.className=svg.getAttribute('class')||'';
  img.style.width=w+'px';img.style.height=h+'px';
  // the CSS that positioned/centered the original <svg> (e.g. ".clogo svg{margin:0 auto}") targets the
  // "svg" tag itself, which no longer matches once replaced by <img> — so copy the resolved layout explicitly
  const cs=getComputedStyle(svg);
  ['display','position','top','left','right','bottom','marginTop','marginRight','marginBottom','marginLeft','transform','transformOrigin'].forEach(p=>{
    const v=cs[p]; if(v && v!=='none' && v!=='auto')img.style[p]=v;
  });
  if(cs.display==='block' && (cs.marginLeft==='auto'||cs.marginRight==='auto')){img.style.display='block';img.style.marginLeft='auto';img.style.marginRight='auto';}
  return img;
}

async function buildPdfBlob(opts){

  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF('p','mm','a4');
  document.body.classList.add('exporting');
  const root=document.querySelector('#view .pages');
  const pages=[...document.querySelectorAll('#view .pages .page')];
  if(!pages.length) throw new Error('no pages');
  // html2canvas' inline-SVG support is unreliable (logo/symbol can vanish) — rasterize each SVG to a PNG <img> before capture
  for(const svg of [...root.querySelectorAll('svg')]){
    try{ const img=await svgToImg(svg,3); svg.replaceWith(img); }catch(e){ console.error('svg->img failed',e); }
  }
  try{await document.fonts.ready;}catch(_){}
  await new Promise(r=>setTimeout(r,120));
  try{
    for(let i=0;i<pages.length;i++){
      const canvas=await html2canvas(pages[i],{scale:opts.scale||2,useCORS:true,allowTaint:true,backgroundColor:'#ffffff',logging:false,imageTimeout:0,windowWidth:pages[i].scrollWidth,windowHeight:pages[i].scrollHeight});

    }
    return pdf.output('blob');
  } finally { document.body.classList.remove('exporting'); stepQuote(); }
}

  try{const sd=await idbGet('savedir');if(sd){if((await sd.queryPermission({mode:'readwrite'}))==='granted')SAVEDIR=sd;}}catch(_){}
  const h=await idbGet('dir');if(!h)return;
  try{
    const q=await h.queryPermission({mode:'readwrite'});
    if(q==='granted'){DIRHANDLE=h;await loadFromDir(h);}
    else if($('#linkTxt')){$('#linkTxt').textContent=t('reconnect');}  // needs one click to re-grant
  }catch(_){}
}

<script>
/* Configuratore Yacht — modulo "dashboard"
   Statistiche per commerciale: offerte mese per mese e totale anno (numero e valore), esito (vinta/persa),
   analisi vinte vs offerte, statistiche macchine offerte e vendute.
   Dati: REGISTRY.rows (registro offerte). Ogni riga: {prog,num,date,client,rep,total,machine,status,outcomeDate,wonValue,lines[]}
   status: 'open' | 'won' | 'lost'.  lines: [{code,name,category,qty,value,pkg,won}] una per macchina offerta. */
let DASH=false, dashYear=null, dashRep='';
const DEMO={on:false};   // (non più usato: vedi offerte demo persistenti in fondo al file)
const DSH={
 it:{title:'Dashboard commerciale',year:'Anno',rep:'Commerciale',all:'Tutti i commerciali',back:'← Torna al configuratore',

   sold:'Vendute',cat:'Per categoria',list:'Elenco offerte e esito',num:'Offerta',date:'Data',client:'Cliente',status:'Esito',wonQ:'Valore vinto (€)',
   lines:'Imbarcazioni vendute',sOpen:'Aperta',sWon:'Vinta',sLost:'Persa',monthNames:['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'],
   hintStatus:'Segna l’esito: Vinta o Persa. Se vinta, indica quali imbarcazioni sono state vendute.',saved:'Esito salvato',savedLocal:'Esito salvato (solo su questo browser: collega la cartella per scriverlo nel registro condiviso)',
   none:'—',noSold:'Nessuna imbarcazione ancora segnata come venduta.',noOff:'Nessuna imbarcazione offerta.',allMachines:'Tutte',
   expTitle:'Scadenze offerte',expNext:'Prossima scadenza',expIn:'scade tra',expNone:'Nessuna offerta aperta con scadenza.',expExpired:'Scadute',expActive:'In scadenza (in ordine di scadenza)',
   expDate:'Scade il',expLeft:'Tempo rimasto',expAgo:'scaduta da',expDays:'g',expToday:'scade oggi',expHint:'Solo offerte aperte. Clic su una riga per richiamare l\u2019offerta.',expEmpty:'Nessuna',expOpenN:'offerte aperte'},
 en:{title:'Sales dashboard',year:'Year',rep:'Salesperson',all:'All salespeople',back:'← Back to configurator',
   export:'⬇ Export register',nodata:'No offers registered for this period. Offers appear here when you press “Save offer” in the Offer step.',

   winN:'Win rate (count)',winV:'Win rate (value)',byRep:'Salesperson by salesperson',
   monthly:'Month by month',month:'Month',count:'Offers',value:'Offered value',wonCount:'Won',wonValue:'Won value',rate:'Win % (count)',rateV:'Win % (value)',
   yearTot:'Year total',compare:'Offers vs won',byNumber:'By count',byValue:'By value',
   mOffered:'Boats offered',mSold:'Boats sold',machine:'Boat',times:'Times offered',qty:'Units',valueL:'Value',
   sold:'Sold',cat:'By category',list:'Offers and outcome',num:'Offer',date:'Date',client:'Customer',status:'Outcome',wonQ:'Won value (€)',
   lines:'Boats sold',sOpen:'Open',sWon:'Won',sLost:'Lost',monthNames:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
   hintStatus:'Mark the outcome: Won or Lost. If won, tick which boats were sold.',saved:'Outcome saved',savedLocal:'Outcome saved (this browser only: link the folder to write it to the shared register)',

};
function dt(k){return (DSH[LANG==='it'?'it':'en'])[k]||k;}

/* ---------- parsing / modello dati ---------- */
function parseOfferDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date)return v;
  if(typeof v==='number'&&v>20000){return new Date(Math.round((v-25569)*86400*1000));}   // seriale Excel
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return new Date(+m[1],+m[2]-1,+m[3]);
  const d=new Date(s);return isNaN(d)?null:d;
}
function rowStatus(r){const s=String(r.status||'').toLowerCase();
  if(/^(won|vint)/.test(s))return 'won';if(/^(lost|pers)/.test(s))return 'lost';return 'open';}
function rowLines(r){
  if(Array.isArray(r.lines)&&r.lines.length)return r.lines;
  // registri vecchi: ricava le macchine dal testo "CODICE (Nome) x2 | ..."
  return String(r.machine||'').split(' | ').map(x=>x.trim()).filter(Boolean).map((x,i)=>{
    const m=x.match(/^(.*?)\s*\((.*)\)(?:\s*x(\d+))?$/);
    return m?{code:m[1].trim(),name:m[2].trim(),category:'',qty:+(m[3]||1),value:null,pkg:i+1,won:false}:{code:x,name:x,category:'',qty:1,value:null,pkg:i+1,won:false};
  });
}
function rowWonValue(r){
  if(rowStatus(r)!=='won')return 0;
  if(r.wonValue!==undefined&&r.wonValue!==null&&r.wonValue!=='')return Number(r.wonValue)||0;
  return Number(r.total)||0;
}
function offerLinesFromState(){
  // una riga per macchina offerta (le alternative sono tutte "offerte"; il commerciale segna quale è stata venduta)
  const {sols}=lineTotals();
  return sols.filter(sd=>!sd.s.sparesOnly).map(sd=>{
    const m=(DATA.machines||[]).find(x=>x.code===sd.s.code);
    return {code:sd.s.code||'',name:sd.s.name||'',category:(m&&m.category)||(sd.s.custom?'Fuori catalogo':''),
      qty:sd.s.qty||1,value:Number(sd.solTot.toFixed(2)),pkg:sd.pkg,won:false};
  });
}
const REG_LS='yacht_registry_v1';
function persistRegistryLocal(){if(typeof DEMO!=='undefined'&&DEMO.on)return;try{localStorage.setItem(REG_LS,JSON.stringify(REGISTRY.rows));}catch(_){}}
function loadRegistryLocal(){try{const a=JSON.parse(localStorage.getItem(REG_LS)||'[]');if(Array.isArray(a)&&a.length&&!REGISTRY.rows.length)REGISTRY.rows=a;}catch(_){}}

/* ---------- aggregazioni ---------- */
function dashRows(){
  return offerRows().filter(r=>{
    const d=parseOfferDate(r.date);
    if(!d||d.getFullYear()!==dashYear)return false;
    if(dashRep&&String(r.rep).trim()!==dashRep)return false;
    return true;
  });
}
function statsOf(rows){
  const s={n:0,v:0,wn:0,wv:0,ln:0,lv:0,on:0,ov:0};
  rows.forEach(r=>{const v=Number(r.total)||0;s.n++;s.v+=v;const st=rowStatus(r);
    if(st==='won'){s.wn++;s.wv+=rowWonValue(r);}else if(st==='lost'){s.ln++;s.lv+=v;}else{s.on++;s.ov+=v;}});
  return s;
}
const pct=(a,b)=>b>0?Math.round(a/b*100)+'%':'—';
function machineStats(rows){
  const off={},sold={},cat={};
  rows.forEach(r=>{
    const won=rowStatus(r)==='won';
    rowLines(r).forEach(l=>{
      const k=l.code||l.name;const q=Number(l.qty)||1,v=Number(l.value)||0,c=l.category||'—';
      const o=off[k]||(off[k]={code:l.code,name:l.name,times:0,qty:0,value:0,category:c});o.times++;o.qty+=q;o.value+=v;
      const cc=cat[c]||(cat[c]={off:0,sold:0,offV:0,soldV:0});cc.off+=q;cc.offV+=v;
      if(won&&l.won){const so=sold[k]||(sold[k]={code:l.code,name:l.name,times:0,qty:0,value:0,category:c});so.times++;so.qty+=q;so.value+=v;cc.sold+=q;cc.soldV+=v;}
    });
  });
  const arr=o=>Object.values(o).sort((a,b)=>b.times-a.times||b.value-a.value);
  return {off:arr(off),sold:arr(sold),cat};
}

function langBadge(r){const l=(r.lang||'it').toUpperCase();return `<span class="badge code" title="Lingua dell'offerta">${l}</span>`;}

/* ---------- scadenze ---------- */
function offerExpiry(r){
  const d=parseOfferDate(r.date);if(!d)return null;
  const days=parseInt(String(r.validity==null||r.validity===''?60:r.validity).replace(/[^\d]/g,''),10);
  const e=new Date(d.getFullYear(),d.getMonth(),d.getDate()+(isNaN(days)?60:days),23,59,59);
  return e;
}
function fmtCountdown(ms){
  const neg=ms<0;ms=Math.abs(ms);
  const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  const p=n=>String(n).padStart(2,'0');
  return {neg,d,txt:`${d}${dt('expDays')} ${p(h)}:${p(m)}:${p(s)}`};
}
function expiryScope(){
  return offerRows().filter(r=>rowStatus(r)==='open'&&(!dashRep||String(r.rep).trim()===dashRep)&&offerExpiry(r))
    .map(r=>({r,exp:offerExpiry(r)})).sort((a,b)=>a.exp-b.exp);
}
function expirySection(){
  const now=Date.now();
  const all=expiryScope();
  const expired=all.filter(x=>x.exp<now);
  const active=all.filter(x=>x.exp>=now);
  const next=active[0];
  const lab=x=>{const idx=REGISTRY.rows.indexOf(x.r);
    const left=x.exp-now;const c=fmtCountdown(left);
    const tone=left<0?'#8c1412':(left<7*86400000?'#b35c00':'var(--navy)');
    return `<tr data-expidx="${idx}" style="cursor:pointer"><td><b>${esc(x.r.num)}</b> ${langBadge(x.r)}${x.r.demo?' <span class="badge" style="background:#FFD017;color:#171717">DEMO</span>':''}</td><td>${esc(x.r.client)}</td>${dashRep?'':`<td>${esc(x.r.rep)}</td>`}<td class="r">${money(x.r.total)}</td><td>${x.exp.toLocaleDateString('it-IT')}</td>
      <td class="r" style="font-weight:800;color:${tone}" data-cd="${x.exp.getTime()}">${left<0?dt('expAgo')+' ':''}${c.txt}</td></tr>`;};
  const head=`<tr><th>${dt('num')}</th><th>${dt('client')}</th>${dashRep?'':`<th>${dt('rep')}</th>`}<th class="r">${dt('value')}</th><th>${dt('expDate')}</th><th class="r">${dt('expLeft')}</th></tr>`;
  const tbl=(rows,empty)=>rows.length?`<div style="overflow:auto"><table class="ptable" style="font-size:13px">${head}${rows.map(lab).join('')}</table></div>`:`<p class="hint" style="margin:6px 0">${empty}</p>`;
  const big=next?`<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--navy);color:#fff;margin-bottom:14px">
      <div style="flex:1;min-width:220px"><div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#FFD017">${dt('expNext')}</div>
      <div style="font-size:16px;margin-top:2px"><b>${esc(next.r.num)}</b> · ${esc(next.r.client)}${dashRep?'':' · '+esc(next.r.rep)}</div>
      <div style="font-size:12.5px;color:#bdbdbd">${dt('expDate')} ${next.exp.toLocaleDateString('it-IT')} · ${money(next.r.total)}</div></div>
      <div style="font-size:34px;font-weight:900;letter-spacing:.5px;font-variant-numeric:tabular-nums" id="expBig" data-cd="${next.exp.getTime()}">${fmtCountdown(next.exp-now).txt}</div></div>`
    :`<p class="hint">${dt('expNone')}</p>`;
  return `<div class="card"><h2>${dt('expTitle')} <span style="font-size:15px;color:var(--muted)">· ${all.length} ${dt('expOpenN')}</span></h2>
    <p class="hint" style="margin-bottom:12px">${dt('expHint')}</p>${big}
    <h3 style="margin:10px 0 6px;font-size:15px;color:#8c1412">${dt('expExpired')} (${expired.length})</h3>${tbl(expired,dt('expEmpty'))}
    <h3 style="margin:16px 0 6px;font-size:15px;color:var(--navy)">${dt('expActive')} (${active.length})</h3>${tbl(active,dt('expEmpty'))}</div>`;
}
let _dashTimer=null;
function startCountdown(){
  if(_dashTimer)clearInterval(_dashTimer);
  _dashTimer=setInterval(()=>{
    if(!DASH||!document.querySelector('[data-cd]')){clearInterval(_dashTimer);_dashTimer=null;return;}
    const now=Date.now();
    document.querySelectorAll('[data-cd]').forEach(el=>{
      const ms=+el.dataset.cd-now,c=fmtCountdown(ms);
      el.textContent=(ms<0&&el.tagName==='TD'?dt('expAgo')+' ':'')+c.txt;
    });
  },1000);
}

/* ---------- render ---------- */
function barPair(label,a,b,aLab,bLab,fmt){
  const max=Math.max(a,b,1);
  return `<div style="margin:12px 0"><div style="font-weight:700;color:var(--navy);margin-bottom:6px">${esc(label)}</div>
    <div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="width:90px;font-size:12px;color:var(--muted)">${esc(aLab)}</span><div style="flex:1;background:var(--soft);border-radius:4px"><div style="width:${a/max*100}%;background:var(--navy);height:20px;border-radius:4px"></div></div><b style="min-width:110px;text-align:right">${fmt(a)}</b></div>
    <div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="width:90px;font-size:12px;color:var(--muted)">${esc(bLab)}</span><div style="flex:1;background:var(--soft);border-radius:4px"><div style="width:${b/max*100}%;background:var(--red);height:20px;border-radius:4px"></div></div><b style="min-width:110px;text-align:right">${fmt(b)}</b></div></div>`;
}
function monthlyChart(months){
  const W=900,H=220,pad=34,bw=(W-pad*2)/12;
  const max=Math.max(1,...months.map(m=>Math.max(m.v,m.wv)));
  let g='';
  months.forEach((m,i)=>{
    const x=pad+i*bw, h1=(m.v/max)*(H-60), h2=(m.wv/max)*(H-60);
    g+=`<rect x="${x+6}" y="${H-30-h1}" width="${bw/2-8}" height="${h1}" fill="#171717"><title>${money(m.v)}</title></rect>`;
    g+=`<rect x="${x+bw/2}" y="${H-30-h2}" width="${bw/2-8}" height="${h2}" fill="#AA1917"><title>${money(m.wv)}</title></rect>`;
    g+=`<text x="${x+bw/2}" y="${H-12}" text-anchor="middle" font-size="12" fill="#6f6f6f">${dt('monthNames')[i]}</text>`;
    if(m.n)g+=`<text x="${x+bw/2}" y="${H-34-Math.max(h1,h2)}" text-anchor="middle" font-size="11" font-weight="700" fill="#171717">${m.n}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg>
    <div style="font-size:12px;color:var(--muted);margin-top:4px"><span style="display:inline-block;width:10px;height:10px;background:#171717;margin-right:4px"></span>${dt('offered')} &nbsp; <span style="display:inline-block;width:10px;height:10px;background:#AA1917;margin-right:4px"></span>${dt('wonVal')} &nbsp; (${dt('count')})</div>`;
}
function renderDashboard(){
  const v=$('#view');
  loadRegistryLocal();
  ensureDemoSeed();
  const years=[...new Set(offerRows().map(r=>{const d=parseOfferDate(r.date);return d?d.getFullYear():null;}).filter(Boolean))].sort((a,b)=>b-a);
  const cur=new Date().getFullYear();
  if(!years.includes(cur))years.unshift(cur);
  if(dashYear==null||!years.includes(dashYear))dashYear=years.includes(cur)?cur:years[0];
  const reps=[...new Set(offerRows().map(r=>String(r.rep||'').trim()).filter(Boolean))].sort();
  if(dashRep&&!reps.includes(dashRep))dashRep='';
  const rows=dashRows();
  const st=statsOf(rows);
  const head=`<div class="card">
    <div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
      <h2 style="margin:0">${dt('title')}</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">
        <label class="fld" style="min-width:110px">${dt('year')}<select id="d_year">${years.map(y=>`<option${y===dashYear?' selected':''}>${y}</option>`).join('')}</select></label>
        <label class="fld" style="min-width:220px">${dt('rep')}<select id="d_rep"><option value="">${dt('all')}</option>${reps.map(r=>`<option${r===dashRep?' selected':''}>${esc(r)}</option>`).join('')}</select></label>
        ${hasDemoRows()?`<button class="btn sm" id="d_demoToggle" style="background:#FFD017;color:#171717">${demoVisible()?'Nascondi demo':'Mostra demo'}</button>${hasRealRows()&&demoVisible()?`<button class="btn sm" id="d_demoOnly" style="background:${demoOnly()?'#1f7a4d':'#4a4a4a'};color:#fff">${demoOnly()?'✓ Solo demo (presentazione)':'Solo demo (presentazione)'}</button>`:''}<button class="btn ghost sm" id="d_demoDel">Elimina offerte demo</button>`:`<button class="btn ghost sm" id="d_demo">Carica offerte demo</button>`}
        <button class="btn ghost sm" id="d_export">${dt('export')}</button>
        <button class="btn nav sm" id="d_back">${dt('back')}</button>
      </div></div></div>`;
  const demoBanner=(hasDemoRows()&&demoVisible())?`<div class="card" style="background:#FFF6D1;border-color:#FFD017"><b>OFFERTE DEMO</b> · 42 offerte fittizie: 32 di prova (prezzi inventati) e 10 complete, ognuna con una barca e 15-22 optional (prezzi del listino caricato), numero «DEMO-…»), richiamabili e modificabili. Restano solo in questo browser: non finiscono nel registro Excel né su GitHub. Si eliminano con «Elimina offerte demo».</div>`:'';
  if(!rows.length){
    v.innerHTML=demoBanner+head+`<div class="card"><p class="hint" style="margin:0">${dt('nodata')}</p></div>`;wireDash();return;
  }
  const kpi=(l,val,sub,c)=>`<div style="flex:1;min-width:150px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff">
      <div style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)">${l}</div>
      <div style="font-size:28px;font-weight:900;color:${c||'var(--navy)'};line-height:1.2">${val}</div>
      <div style="font-size:12px;color:var(--muted)">${sub||'&nbsp;'}</div></div>`;
  const kpis=`<div class="card"><div style="display:flex;flex-wrap:wrap;gap:12px">
    ${kpi(dt('offers'),st.n,money(st.v))}
    ${kpi(dt('won'),st.wn,money(st.wv),'var(--red)')}
    ${kpi(dt('lost'),st.ln,money(st.lv))}
    ${kpi(dt('open'),st.on,money(st.ov))}
    ${kpi(dt('winN'),pct(st.wn,st.n),st.wn+' / '+st.n)}
    ${kpi(dt('winV'),pct(st.wv,st.v),money(st.wv)+' / '+money(st.v))}
  </div></div>`;
  // per commerciale (solo quando si guardano tutti)
  let byRep='';
  if(!dashRep){
    const all=offerRows().filter(r=>{const d=parseOfferDate(r.date);return d&&d.getFullYear()===dashYear;});
    const names=[...new Set(all.map(r=>String(r.rep||'').trim()||'—'))].sort();
    byRep=`<div class="card"><h2>${dt('byRep')}</h2><div style="overflow:auto"><table class="ptable" style="font-size:13px">
      <tr><th>${dt('rep')}</th><th class="r">${dt('count')}</th><th class="r">${dt('value')}</th><th class="r">${dt('wonCount')}</th><th class="r">${dt('wonValue')}</th><th class="r">${dt('rate')}</th><th class="r">${dt('rateV')}</th></tr>
      ${names.map(n=>{const s=statsOf(all.filter(r=>(String(r.rep||'').trim()||'—')===n));
        return `<tr style="cursor:pointer" data-pickrep="${esc(n)}"><td><b>${esc(n)}</b></td><td class="r">${s.n}</td><td class="r">${money(s.v)}</td><td class="r">${s.wn}</td><td class="r">${money(s.wv)}</td><td class="r">${pct(s.wn,s.n)}</td><td class="r">${pct(s.wv,s.v)}</td></tr>`;}).join('')}
    </table></div></div>`;
  }
  // mese per mese
  const months=Array.from({length:12},()=>({n:0,v:0,wn:0,wv:0}));
  rows.forEach(r=>{const d=parseOfferDate(r.date);const m=months[d.getMonth()];m.n++;m.v+=Number(r.total)||0;
    if(rowStatus(r)==='won'){m.wn++;m.wv+=rowWonValue(r);}});
  const monthly=`<div class="card"><h2>${dt('monthly')}${dashRep?' · '+esc(dashRep):''} · ${dashYear}</h2>
    ${monthlyChart(months)}
    <div style="overflow:auto;margin-top:10px"><table class="ptable" style="font-size:13px">
      <tr><th>${dt('month')}</th><th class="r">${dt('count')}</th><th class="r">${dt('value')}</th><th class="r">${dt('wonCount')}</th><th class="r">${dt('wonValue')}</th><th class="r">${dt('rate')}</th><th class="r">${dt('rateV')}</th></tr>

async function dashPersist(row){
  persistRegistryLocal();
  let ok=false;try{ok=await writeRegistryBack();}catch(_){}
  if(GH.ok&&row&&!row.demo){try{ok=(await ghUpdateOffer(row))||ok;}catch(e){console.error(e);}}
  flash(ok?dt('saved'):dt('savedLocal'));
}
function wireDash(){
  const v=$('#view');
  $('#d_year').onchange=e=>{dashYear=+e.target.value;renderDashboard();};
  $('#d_rep').onchange=e=>{dashRep=e.target.value;renderDashboard();};
  $('#d_back').onclick=()=>toggleDashboard(false);
  if($('#d_demo'))$('#d_demo').onclick=()=>{installDemo();setDemoVisible(true);renderDashboard();};
  if($('#d_demoOnly'))$('#d_demoOnly').onclick=()=>{setDemoOnly(!demoOnly());renderDashboard();};
  if($('#d_demoToggle'))$('#d_demoToggle').onclick=()=>{setDemoVisible(!demoVisible());renderDashboard();};
  if($('#d_demoDel'))$('#d_demoDel').onclick=()=>{if(confirm('Eliminare le offerte demo?')){removeDemo();renderDashboard();}};
  $('#d_export').onclick=()=>{try{downloadRegistry();}catch(e){flash(t('load_err'));}};
  v.querySelectorAll('[data-expidx]').forEach(tr=>tr.onclick=()=>recallFromList(REGISTRY.rows[+tr.dataset.expidx]));
  startCountdown();
  v.querySelectorAll('[data-pickrep]').forEach(tr=>tr.onclick=()=>{dashRep=tr.dataset.pickrep==='—'?'':tr.dataset.pickrep;renderDashboard();});
  v.querySelectorAll('[data-st]').forEach(sel=>sel.onchange=async()=>{
    const r=REGISTRY.rows[+sel.dataset.st];if(!r)return;
    r.status=sel.value;r.outcomeDate=sel.value==='open'?'':new Date().toLocaleDateString('it-IT');
    if(sel.value==='won'){
      r.lines=rowLines(r).map(l=>({...l}));
      // di default risulta venduta la prima soluzione (pacchetto 1); il commerciale può correggere con le caselle
      const first=Math.min(...r.lines.map(l=>l.pkg||1));
      r.lines.forEach(l=>{l.won=(l.pkg||1)===first;});
      r.wonValue='';
    }else{r.lines=rowLines(r).map(l=>({...l,won:false}));r.wonValue='';}
    await dashPersist(r);renderDashboard();
  });
  v.querySelectorAll('[data-won]').forEach(cb=>cb.onchange=async()=>{
    const [i,li]=cb.dataset.won.split('|').map(Number);const r=REGISTRY.rows[i];
    r.lines=rowLines(r).map(l=>({...l}));r.lines[li].won=cb.checked;
    if(r.wonValue===''||r.wonValue==null||!r.wonManual){   // valore vinto = somma delle macchine vendute (finché non lo si modifica a mano)
      const sum=r.lines.filter(l=>l.won).reduce((x,l)=>x+(Number(l.value)||0),0);
      r.wonValue=sum||'';
    }
    await dashPersist(r);renderDashboard();
  });
  v.querySelectorAll('[data-wonval]').forEach(inp=>inp.onchange=async()=>{
    const r=REGISTRY.rows[+inp.dataset.wonval];if(!r)return;
    r.wonValue=inp.value===''?'':Number(inp.value);r.wonManual=true;
    await dashPersist(r);renderDashboard();
  });
}
async function toggleDashboard(on){
  DASH=on;

  const nb=document.querySelector('.navbar');if(nb)nb.style.display=hide;
  const b=$('#dashBtn');if(b)b.classList.toggle('on',on);
  render();
}

<script>
/* Configuratore Yacht — modulo "github"
   Salva ogni offerta (JSON + PDF) in una repo GitHub PRIVATA tramite le API REST e rilegge le offerte per la dashboard.
   - Configurazione e token restano nel localStorage del browser: NON sono mai nel codice / nella repo.
   - Un file per offerta: <cartella>/<anno>/<NUMERO>.json  e  <NUMERO>.pdf  (nessun conflitto tra commerciali).
   - Il numero progressivo è riservato creando il file: se esiste già (422) si passa al successivo.
   - Rifiuta di scrivere se la repo è PUBBLICA: i dati dei clienti non devono finire in una repo aperta. */
const GH_LS='yacht_github_v1', GH_CACHE='yacht_github_cache_v1';
const GH={cfg:{owner:'',repo:'',branch:'main',dir:'offerte',token:''},ok:false,msg:'',busy:false,proxy:false};   // proxy: collegamento tramite funzione Netlify (token sul server)
// valori predefiniti (modificabili): proprietario e repo privata delle offerte
const GH_DEFAULT={owner:'rarmentaro1204',repo:'azimut-offerte',branch:'main',dir:'offerte'};
function ghLoadCfg(){
  Object.assign(GH.cfg,GH_DEFAULT);
  try{const c=JSON.parse(localStorage.getItem(GH_LS)||'null');if(c)Object.keys(c).forEach(k=>{if(c[k])GH.cfg[k]=c[k];});}catch(_){}
}
function ghSaveCfg(){if(GH.proxy)return;try{localStorage.setItem(GH_LS,JSON.stringify(GH.cfg));}catch(_){}}
function ghHasCfg(){return !!(GH.cfg.token&&GH.cfg.owner&&GH.cfg.repo);}
function ghRepoPath(){return `/repos/${encodeURIComponent(GH.cfg.owner)}/${encodeURIComponent(GH.cfg.repo)}`;}
// Sul sito pubblicato il token sta sul server (funzione Netlify /.netlify/functions/gh): ogni PC/browser è collegato da solo.
async function ghDetectProxy(){
  if(!/^https?:/.test(location.protocol))return false;
  try{
    const r=await fetch('/.netlify/functions/gh',{cache:'no-store'});
    if(!r.ok||!/json/.test(r.headers.get('content-type')||''))return false;
    const j=await r.json();
    if(j&&j.configured){GH.proxy=true;Object.assign(GH.cfg,{owner:j.owner,repo:j.repo,branch:GH_DEFAULT.branch,dir:GH_DEFAULT.dir,token:'(server)'});return true;}
  }catch(_){}
  return false;
}
async function ghApi(path,opt={}){
  if(GH.proxy){
    const res=await fetch('/.netlify/functions/gh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({method:opt.method||'GET',path,body:opt.body||null})});
    let j=null;try{j=await res.json();}catch(_){}
    if(!j)return {status:res.status,ok:false,body:null};
    const st=j.status!=null?j.status:res.status;
    return {status:st,ok:st>=200&&st<300,body:j.body};
  }
  const res=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:Object.assign({
    Authorization:'Bearer '+GH.cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},opt.headers||{})}));
  let body=null;try{body=await res.json();}catch(_){}
  return {status:res.status,ok:res.ok,body};
}
const ghB64=s=>btoa(unescape(encodeURIComponent(s)));
const ghFromB64=b=>decodeURIComponent(escape(atob(String(b).replace(/\s/g,''))));
function ghBlobB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob);});}
function ghSetState(ok,msg){GH.ok=ok;GH.msg=msg||'';ghRenderBtn();}
function ghRenderBtn(){
  const b=$('#ghBtn');if(!b)return;
  b.textContent=GH.ok?'✓ GitHub':'GitHub';
  b.title=GH.ok?(GH.cfg.owner+'/'+GH.cfg.repo+' · '+GH.msg):(GH.msg||'Collega GitHub per salvare le offerte nella repo');
  b.style.background=GH.ok?'#1f7a4d':'#4a4a4a';
}
// collegamento + controlli di sicurezza (repo privata, permesso di scrittura)
async function ghConnect(silent){
  if(!GH.cfg.token){ghSetState(false,'Manca il token');return false;}
  if(!GH.cfg.owner||!GH.cfg.repo){ghSetState(false,'Mancano proprietario o repo: compila entrambi i campi');return false;}
  try{
    const r=await ghApi(ghRepoPath());
    if(r.status===401){ghSetState(false,'Token non valido o scaduto: creane uno nuovo');return false;}
    if(r.status===403){ghSetState(false,'Accesso negato (403): controlla permessi del token o limite di richieste');return false;}
    if(r.status===404){ghSetState(false,`Repo «${GH.cfg.owner}/${GH.cfg.repo}» non trovata, oppure il token non ha accesso a quella repo`);return false;}
    if(!r.ok){ghSetState(false,'Errore GitHub '+r.status);return false;}
    if(r.body.private!==true){ghSetState(false,'La repo è PUBBLICA: per sicurezza non salvo dati dei clienti');return false;}
    if(r.body.permissions&&r.body.permissions.push===false){ghSetState(false,'Il token non ha il permesso di scrittura');return false;}
    GH.cfg.branch=GH.cfg.branch||r.body.default_branch||'main';
    ghSetState(true,'repo privata · '+GH.cfg.branch);
    return true;
  }catch(e){ghSetState(false,'Rete non raggiungibile');return false;}
}
async function ghTree(){
  const r=await ghApi(`${ghRepoPath()}/git/trees/${encodeURIComponent(GH.cfg.branch)}?recursive=1`);
  if(r.status===409||r.status===404)return [];           // repo vuota / branch non ancora creato
  if(!r.ok)throw new Error('tree '+r.status);
  const dir=GH.cfg.dir.replace(/^\/|\/$/g,'')+'/';
  return (r.body.tree||[]).filter(x=>x.type==='blob'&&x.path.startsWith(dir)&&/\.json$/i.test(x.path));
}
// legge tutte le offerte dalla repo e le unisce al registro locale (GitHub vince in caso di stesso numero)
// aggiorna al massimo una volta ogni 30 s (usata quando si entra nei passi Cliente/Offerta)
function ghRefreshSoon(){if(GH.ok&&Date.now()-(GH.lastRefresh||0)>30000)ghRefresh().then(refreshOfferNumber);}
async function ghRefresh(){
  if(!GH.ok||(typeof DEMO!=='undefined'&&DEMO.on))return false;
  GH.lastRefresh=Date.now();
  try{
    const files=await ghTree();
    let cache={};try{cache=JSON.parse(localStorage.getItem(GH_CACHE)||'{}');}catch(_){}
    const next={},rows=[];
    const todo=[];
    files.forEach(f=>{if(cache[f.sha])next[f.sha]=cache[f.sha];else todo.push(f);});
    let i=0;
    async function worker(){
      while(i<todo.length){const f=todo[i++];
        try{
          const r=await ghApi(`${ghRepoPath()}/git/blobs/${f.sha}`);
          if(r.ok){const j=JSON.parse(ghFromB64(r.body.content));if(j&&j.row){next[f.sha]=Object.assign({},j.row,{ghPath:f.path});}}
        }catch(e){console.error('gh blob',f.path,e);}
      }
    }
    await Promise.all(Array.from({length:6},worker));
    files.forEach(f=>{if(next[f.sha])rows.push(Object.assign({},next[f.sha],{ghPath:f.path}));});
    try{localStorage.setItem(GH_CACHE,JSON.stringify(next));}catch(_){}
    // merge: righe remote + righe locali non ancora presenti su GitHub
    const byNum=new Map();
    REGISTRY.rows.forEach(r=>byNum.set(String(r.num).trim(),r));
    rows.forEach(r=>byNum.set(String(r.num).trim(),r));
    REGISTRY.rows=[...byNum.values()].sort((a,b)=>(+a.prog||0)-(+b.prog||0));
    persistRegistryLocal();
    return true;
  }catch(e){console.error(e);flash('GitHub: lettura offerte non riuscita');return false;}
}
function ghOfferPath(num,date){
  const d=(typeof parseOfferDate==='function'&&parseOfferDate(date))||new Date();
  return `${GH.cfg.dir.replace(/^\/|\/$/g,'')}/${d.getFullYear()}/${String(num).replace(/[^\w\-]/g,'_')}`;
}
async function ghPut(path,contentB64,message,sha){
  const body={message,content:contentB64,branch:GH.cfg.branch};if(sha)body.sha=sha;
  return ghApi(`${ghRepoPath()}/contents/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'PUT',body:JSON.stringify(body)});
}
// salva l'offerta (riserva il numero creando il file). Ritorna {num} (può cambiare se il numero era già preso).
async function ghSaveOffer(row,snapshot){
  if(!GH.ok)return {saved:false};
  const mk=p=>BRAND.offerPrefix+String(yr).slice(2)+'-'+String(p).padStart(3,'0');
  for(let tries=0;tries<20;tries++){
    const path=ghOfferPath(row.num,row.date)+'.json';
    const payload={version:1,savedAt:new Date().toISOString(),row:Object.assign({},row,{ghPath:undefined}),snapshot:snapshot||null};
    const r=await ghPut(path,ghB64(JSON.stringify(payload)),`Offerta ${row.num} · ${row.client||''} · ${row.rep||''}`);
    if(r.ok){row.ghPath=path;return {saved:true,num:row.num};}
    if(r.status===422||r.status===409){      // numero già usato da un collega: prendi il successivo
      const m=String(row.num).match(/^(.*?)-(\d+)(_REV\d+)?$/i);
      if(m&&!m[3]){row.prog=(+row.prog||+m[2])+1;row.num=mk(row.prog);}
      else row.num=String(row.num)+'_b';
      S.offerNum=row.num;continue;
    }
    throw new Error('GitHub '+r.status+' '+((r.body&&r.body.message)||''));
  }
  throw new Error('numero offerta non riservabile');
}
async function ghUploadFile(row,blob,ext,label){
  if(!GH.ok||!blob)return false;
  const path=ghOfferPath(row.num,row.date)+ext;
  const b64=await ghBlobB64(blob);
  let r=await ghPut(path,b64,`${label} offerta ${row.num}`);
  if(r.status===422||r.status===409){      // già presente (revisione): aggiorna con lo sha attuale
    const cur=await ghApi(`${ghRepoPath()}/contents/${path.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(GH.cfg.branch)}`);
    if(cur.ok)r=await ghPut(path,b64,`${label} offerta ${row.num} (aggiornato)`,cur.body.sha);
  }
  return r.ok;
}
function ghUploadPdf(row,blob){return ghUploadFile(row,blob,'.pdf','PDF');}
// aggiorna esito/valore di un'offerta già salvata (dashboard), conservando lo snapshot
async function ghUpdateOffer(row){
  if(!GH.ok||!row.ghPath)return false;
  const url=`${ghRepoPath()}/contents/${row.ghPath.split('/').map(encodeURIComponent).join('/')}`;
  for(let k=0;k<3;k++){
    const cur=await ghApi(`${url}?ref=${encodeURIComponent(GH.cfg.branch)}`);
    if(!cur.ok)return false;
    let old={};try{old=JSON.parse(ghFromB64(cur.body.content));}catch(_){}
    const payload={version:1,savedAt:old.savedAt||new Date().toISOString(),updatedAt:new Date().toISOString(),
      row:Object.assign({},row,{ghPath:undefined}),snapshot:old.snapshot||null};
    const r=await ghPut(row.ghPath,ghB64(JSON.stringify(payload)),`Esito offerta ${row.num}: ${rowStatus(row)}`,cur.body.sha);
    if(r.ok)return true;
    if(r.status!==409&&r.status!==422)return false;
  }
  return false;
}

<script>
/* Configuratore Yacht — modulo "settings"
   Impostazioni che devono restare salvate: dati emittente, commerciali, ultime condizioni usate, clienti inseriti.
   - Copia locale nel browser (localStorage) e, se GitHub è collegato (repo PRIVATA verificata), anche in <repo>/config/impostazioni.json.
   - All'apertura si leggono da GitHub: si ritrovano su qualunque computer collegato alla stessa repo. */
const SET_LS='yacht_settings_v1';
const SET={issuer:{},reps:[],rep:null,terms:{},clients:[],savedAt:0};
const SET_PATH='config/impostazioni.json';
const isPlaceholderRep=r=>/^\s*\[/.test(String(r&&r.name||''));
function setLoadLocal(){try{const o=JSON.parse(localStorage.getItem(SET_LS)||'null');if(o)Object.assign(SET,o);}catch(_){}}
function setSaveLocal(){try{localStorage.setItem(SET_LS,JSON.stringify(SET));}catch(_){}}
// elenco commerciali: quelli salvati sostituiscono i segnaposto
function mergeRepsFromSettings(list){
  const out=(list||[]).filter(r=>!isPlaceholderRep(r)||!SET.reps.length);
  SET.reps.forEach(r=>{if(r&&r.name&&!out.some(x=>x.name===r.name))out.push({name:r.name,email:r.email||'',phone:r.phone||'',role:r.role||''});});
  return out.length?out:list;
}
function setApplyAll(){
  Object.keys(SET.issuer||{}).forEach(k=>{if(SET.issuer[k]!=null)issuerSet(k,SET.issuer[k],true);});
  DATA.reps=mergeRepsFromSettings(DATA.reps);
  if(SET.rep&&SET.rep.name&&(!S.rep||!S.rep.name||isPlaceholderRep(S.rep)))S.rep=Object.assign({name:'',email:'',phone:''},SET.rep);
  // condizioni: solo se ancora quelle predefinite (non si sovrascrive quello che l'utente ha già digitato)
  const T=SET.terms||{};
  if(T.validity&&(S.validity==='30'||!S.validity))S.validity=T.validity;
  if(T.lead!=null&&!S.lead)S.lead=T.lead;
  if(T.payment&&!S.payment)S.payment=T.payment;
  if(T.incoterm&&(S.incoterm==='Ex Works'||!S.incoterm))S.incoterm=T.incoterm;
  if(T.exclusions&&!S.exclusions)S.exclusions=T.exclusions;
  (SET.clients||[]).forEach(c=>{if(c&&c.company&&!CLIENTS.some(x=>String(x.company).toLowerCase()===String(c.company).toLowerCase()))CLIENTS.push(c);});
}
let _setT;
function setQueue(){
  SET.issuer=Object.fromEntries(ISSUER_FIELDS.map(([f])=>[f,issuerGet(f)]));
  SET.savedAt=Date.now();setSaveLocal();
  clearTimeout(_setT);_setT=setTimeout(setPushGh,1500);
}
function repRemember(){
  const r=S.rep;if(!r||!String(r.name||'').trim())return;
  const i=SET.reps.findIndex(x=>x.name===r.name);
  const item={name:r.name,email:r.email||'',phone:r.phone||'',role:r.role||''};
  if(i>=0)SET.reps[i]=item;else SET.reps.push(item);
  SET.rep=item;setQueue();
}
// dopo il salvataggio di un'offerta: ricorda condizioni usate e cliente
function settingsAfterSave(){
  SET.terms={validity:S.validity,lead:S.lead,payment:S.payment,incoterm:S.incoterm,exclusions:S.exclusions};
  if(String(S.client||'').trim()){
    const item={company:S.client.trim(),contact:S.contact||'',role:S.role||'',phone:S.phone||'',email:S.email||''};
    const i=SET.clients.findIndex(c=>String(c.company).toLowerCase()===item.company.toLowerCase());
    if(i>=0)SET.clients[i]=item;else SET.clients.push(item);
    setApplyAll();
  }
  repRemember();
}
async function setPushGh(){
  if(!GH.ok)return false;
  try{
    const url=`${ghRepoPath()}/contents/${SET_PATH.split('/').map(encodeURIComponent).join('/')}`;
    for(let k=0;k<3;k++){
      const cur=await ghApi(`${url}?ref=${encodeURIComponent(GH.cfg.branch)}`);
      const sha=cur.ok?cur.body.sha:undefined;
      const r=await ghPut(SET_PATH,ghB64(JSON.stringify({version:1,savedAt:SET.savedAt||Date.now(),issuer:SET.issuer,reps:SET.reps,rep:SET.rep,terms:SET.terms,clients:SET.clients},null,1)),'Impostazioni configuratore',sha);
      if(r.ok)return true;
      if(r.status!==409&&r.status!==422)return false;
    }
  }catch(e){console.warn('impostazioni non salvate su GitHub',e);}
  return false;
}
async function setPullGh(){
  if(!GH.ok)return;
  try{
    const r=await ghApi(`${ghRepoPath()}/contents/${SET_PATH.split('/').map(encodeURIComponent).join('/')}?ref=${encodeURIComponent(GH.cfg.branch)}`);
    if(!r.ok){ if(r.status===404)setQueue(); return; }   // prima volta: crea il file con le impostazioni correnti
    const remote=JSON.parse(ghFromB64(r.body.content));
    if((remote.savedAt||0)>=(SET.savedAt||0)){
      ['issuer','reps','rep','terms','clients'].forEach(k=>{if(remote[k]!=null)SET[k]=remote[k];});
      SET.savedAt=remote.savedAt||0;setSaveLocal();
    }else setQueue();   // il locale è più recente: aggiorna GitHub
    setApplyAll();
    if(typeof step!=='undefined'&&step===0)render();
  }catch(e){console.warn('impostazioni da GitHub non lette',e);}
}
function settingsInit(){setLoadLocal();setApplyAll();}
</script>
<script>

  try{

    // tieni al massimo le ultime 60 copie locali
    const keys=Object.keys(localStorage).filter(k=>k.startsWith(SNAP_LS));
    if(keys.length>60){keys.map(k=>[k,(JSON.parse(localStorage.getItem(k)||'{}').savedAt)||''])
      .sort((a,b)=>a[1].localeCompare(b[1])).slice(0,keys.length-60).forEach(([k])=>localStorage.removeItem(k));}

      <select id="ol_st" style="padding:9px;border:1px solid var(--line);border-radius:9px"><option value="">Tutti gli esiti</option><option value="open">Aperte</option><option value="won">Vinte</option><option value="lost">Perse</option></select>
    </div>
    <div style="overflow:auto;max-height:58vh"><table class="ptable" style="font-size:13px" id="ol_tbl"></table></div></div>`;
  document.body.appendChild(o);
  o.querySelector('#ol_close').onclick=()=>o.remove();
  const st=o.querySelector('#ol_status');
  const draw=()=>{
    const q=o.querySelector('#ol_q').value.trim().toLowerCase(),rep=o.querySelector('#ol_rep').value,sf=o.querySelector('#ol_st').value;
    const rows=offerRows().filter(r=>(!rep||String(r.rep).trim()===rep)&&(!sf||rowStatus(r)===sf)&&
      (!q||(String(r.num)+' '+r.client+' '+r.machine+' '+r.rep).toLowerCase().includes(q)))
      .sort((a,b)=>(parseOfferDate(b.date)||0)-(parseOfferDate(a.date)||0)||(+b.prog||0)-(+a.prog||0));
    const lab={won:'Vinta',lost:'Persa',open:'Aperta'};
    o.querySelector('#ol_tbl').innerHTML=`<tr><th>Offerta</th><th>Data</th><th>Cliente</th><th>Commerciale</th><th class="r">Valore</th><th>Esito</th><th>Macchine</th></tr>`+
      (rows.length?rows.map(r=>{const i=REGISTRY.rows.indexOf(r);
        return `<tr data-row="${i}" style="cursor:pointer"><td><b>${esc(r.num)}</b> <span class="badge code">${String(r.lang||'it').toUpperCase()}</span>${r.demo?' <span class="badge" style="background:#FFD017;color:#171717">DEMO</span>':''}</td><td>${esc((parseOfferDate(r.date)||new Date()).toLocaleDateString('it-IT'))}</td><td>${esc(r.client)}</td><td>${esc(r.rep)}</td><td class="r">${money(r.total)}</td><td>${lab[rowStatus(r)]}</td><td style="color:var(--muted);font-size:12px">${esc(String(r.machine||'').slice(0,70))}</td></tr>`;}).join('')
        :`<tr><td colspan="7" style="color:var(--muted);padding:16px">Nessuna offerta trovata.</td></tr>`);
    o.querySelectorAll('[data-row]').forEach(tr=>tr.onclick=()=>recallFromList(REGISTRY.rows[+tr.dataset.row]));
  };
  const fillReps=()=>{const sel=o.querySelector('#ol_rep'),cur=sel.value;
    const reps=[...new Set(offerRows().map(r=>String(r.rep||'').trim()).filter(Boolean))].sort();
    sel.innerHTML='<option value="">Tutti i commerciali</option>'+reps.map(n=>`<option${n===cur?' selected':''}>${esc(n)}</option>`).join('');};
  ['#ol_q','#ol_rep','#ol_st'].forEach(s=>o.querySelector(s).addEventListener('input',draw));
  loadRegistryLocal();ensureDemoSeed();fillReps();draw();
  if(GH.ok){const ok=await ghRefresh();fillReps();draw();st.textContent=ok?`${REGISTRY.rows.length} offerte · clicca una riga per richiamarla`:'Elenco da GitHub non aggiornato';}
  else st.textContent=`${REGISTRY.rows.length} offerte · clicca una riga per richiamarla`;
}
</script>
<script>
/* Configuratore Yacht — modulo "xlsx-loader" */
function norm(s){return String(s==null?'':s).trim();}
function num(v){return parseFloat(String(v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'))||0;}
// Read a sheet as objects, auto-detecting the header row (skips title/subtitle rows).
function sheetRows(sheet,markers){
  const aoa=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
  let hi=-1;
  for(let i=0;i<Math.min(aoa.length,15);i++){
    const cells=aoa[i].map(c=>norm(c).toLowerCase());
    if(markers.some(m=>cells.includes(m))){hi=i;break;}
  }
  if(hi<0)hi=0;
  const head=aoa[hi].map(c=>norm(c));
  const out=[];
  for(let i=hi+1;i<aoa.length;i++){
    const row=aoa[i];if(!row.some(c=>norm(c)!==''))continue;
    const o={};head.forEach((h,j)=>{if(h)o[h]=row[j]!=null?row[j]:'';});
    out.push(o);
  }
  return out;
}
function handleXlsx(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>applyXlsxBuffer(ev.target.result,file.name);
  reader.readAsArrayBuffer(file);
}
function applyXlsxBuffer(buf,fileName){
  {
    {
    try{
      const wb=XLSX.read(buf,{type:'array'});
      const out={machines:[],accessories:[],reps:[]};
      const findSheet=(names)=>{for(const n of wb.SheetNames){if(names.some(x=>n.toLowerCase().includes(x)))return n;}return null;};
      const sM=findSheet(['macchin','machine','máquina','machines']);
      const sA=findSheet(['access','accessor','accesori']);
      const sR=findSheet(['commerc','rep','referent','vendeur','vendedor']);
      if(sM){const rows=sheetRows(wb.Sheets[sM],['codice','code','código']);
        rows.forEach(r=>{
          const code=norm(r.Codice||r.Code||r.code||r.CODICE);if(!code)return;
          const get=(...k)=>{for(const key of k){if(r[key]!=null&&r[key]!=='')return r[key];}return '';};
          out.machines.push({code,
            family:norm(get('Famiglia','Family','family')),
            category:norm(get('Categoria','Category','category')),
            name:norm(get('Nome','Name','name')),
            desc:norm(get('Descrizione_EN','Descrizione','Description','desc')),
            atex:/^(si|sì|yes|x|true|1)$/i.test(norm(get('ATEX','Atex','atex'))),
            price:num(get('Prezzo','Prezzo_EUR','Price')),priceUsd:num(get('Prezzo_USD','Price_USD','USD')),
            loa:norm(get('LOA','LOA_m')),beam:norm(get('Larghezza','Larghezza_m')),draft:norm(get('Pescaggio','Pescaggio_m')),
            hull:norm(get('Lunghezza_scafo','Lunghezza_scafo_m')),cabins:norm(get('Cabine')),
            engine:norm(get('Motore_Standard')),speed:norm(get('Velocita','Velocità')),engine_opt:norm(get('Motore_Optional')),speed_opt:norm(get('Velocita_Optional')),
            disp_empty:norm(get('Dislocamento_Vuoto','Dislocamento_Vuoto_kg')),disp_full:norm(get('Dislocamento_Carico','Dislocamento_Carico_kg')),
            fuel:norm(get('Carburante','Carburante_l')),water:norm(get('Acqua','Acqua_l')),persons:norm(get('Persone')),
            marking:'',application:norm(get('Applicazione')),url:norm(get('URL','url')),image:norm(get('Immagine_URL','image')),imageFile:norm(get('Immagine_File','imageFile')),
            subcategory:norm(get('Sottocategoria')),protection:norm(get('Protezione'))});
        });}
      if(sA){const rows=sheetRows(wb.Sheets[sA],['codice','code','código']);
        rows.forEach(r=>{const code=norm(r.Codice||r.Code||r.code);if(!code)return;
          const get=(...k)=>{for(const key of k){if(r[key]!=null&&r[key]!=='')return r[key];}return '';};
          out.accessories.push({code,desc:norm(get('Descrizione','Description','desc')),
            price:num(get('Prezzo','Prezzo_EUR','Price','Prezzo_L0','L0'))});});}
      if(sR){const rows=sheetRows(wb.Sheets[sR],['nome','name','nombre','nom']);
        rows.forEach(r=>{const name=norm(r.Nome||r.Name||r.name);if(!name)return;
          out.reps.push({name,email:norm(r.Email||r.email),phone:norm(r.Telefono||r.Phone||r.phone)});});}
      if(!out.machines.length){flash(t('load_err'));return;}
      if(!out.reps.length)out.reps=EMBEDDED.reps;
      if(typeof mergeRepsFromSettings==='function')out.reps=mergeRepsFromSettings(out.reps);
      if(!out.accessories.length)out.accessories=EMBEDDED.accessories;
      // fusione col catalogo incorporato: il file può contenere solo codice + prezzo (matrice prezzi);
      // i dati tecnici restano quelli del catalogo, il file vince solo dove ha un valore.
      const base=new Map(EMBEDDED.machines.map(m=>[m.code,m]));
      const merged=new Map();
      out.machines.forEach(m=>{const b=base.get(m.code)||{};const r={...b};
        Object.keys(m).forEach(k=>{if(m[k]!==''&&m[k]!=null&&!(k==='atex'&&!m[k]&&b.atex))r[k]=m[k];});
        if(!m.price&&b.price)r.price=b.price;
        if(!m.priceUsd&&b.priceUsd)r.priceUsd=b.priceUsd;
        merged.set(m.code,r);});
      base.forEach((b,c)=>{if(!merged.has(c))merged.set(c,b);});   // modelli non presenti nel file: restano (senza prezzo)
      out.machines=[...merged.values()].map(m=>({...m,category:m.category||'OTHER',name:m.name||m.code}));
      DATA=out;loadedFromFile=true;loadedFileName=fileName;
      if(!S.rep||!S.rep.name||/^\[Commerciale/.test(S.rep.name))S.rep=Object.assign({name:'',email:'',phone:''},DATA.reps[0]);   // non sovrascrive un referente già modificato
      if($('#xlsxTxt'))$('#xlsxTxt').textContent='✓ '+fileName;
      curCat=null;search='';
      flash(t('load_ok').replace('%n',DATA.machines.length));
      render();
    }catch(err){console.error(err);flash(t('load_err'));}
    }
  }
}
</script>
<script>
/* Configuratore Yacht — modulo "hubspot": il passo 1 (Cliente) prende i dati dal CRM HubSpot.
   Il configuratore gira in un iframe aperto dalla scheda sul Deal. Contratto (versione 1):
     la scheda HubSpot invia al configuratore, con postMessage, un oggetto
       { source:'yacht-configurator', v:1, type:'context', payload:{ portalId, deal:{id,name}, company:{id,name},
         contact:{id,name,role,email,phone}, owner:{name,email,phone}, apiBase, token } }
     `token` è una sessione a scadenza breve emessa dal backend del cliente (mai il token HubSpot);
     `apiBase` è l'indirizzo del backend del cliente, usato per cercare clienti e salvare sul Deal.
   Sicurezza: si accettano messaggi solo da origini HubSpot (elenco sotto) e solo dalla finestra che incornicia la pagina;
   ogni valore è ridotto a testo semplice e lunghezza limitata prima di toccare lo stato. */
const HS={
  active:false, ctx:null, apiBase:'', token:'',
  origins:['https://app.hubspot.com','https://app-eu1.hubspot.com','https://app-na2.hubspot.com','https://app.hubspotqa.com']
};
function hsOriginOk(o){
  if(HS.origins.includes(o))return true;
  return /^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(o);   // solo in sviluppo locale
}
function hsStr(v,n){return String(v==null?'':v).replace(/[\u0000-\u001f\u007f]/g,' ').trim().slice(0,n||200);}
function hsApiBaseOk(u){try{const x=new URL(u);return x.protocol==='https:'||(x.protocol==='http:'&&/^(localhost|127\.0\.0\.1)$/.test(x.hostname));}catch(_){return false;}}
function hsApply(p){
  if(!p||typeof p!=='object')return false;
  const co=p.company||{},ct=p.contact||{},ow=p.owner||{},dl=p.deal||{};
  HS.ctx={portalId:hsStr(p.portalId,20),dealId:hsStr(dl.id,30),dealName:hsStr(dl.name,150),companyId:hsStr(co.id,30),contactId:hsStr(ct.id,30)};
  if(hsApiBaseOk(p.apiBase)&&typeof p.token==='string'&&p.token.length<4096){HS.apiBase=p.apiBase.replace(/\/+$/,'');HS.token=p.token;}
  if(co.name)S.client=hsStr(co.name);
  if(ct.name)S.contact=hsStr(ct.name);
  if(ct.role)S.role=hsStr(ct.role);
  if(ct.email)S.email=hsStr(ct.email,120);
  if(ct.phone)S.phone=hsStr(ct.phone,40);
  if(ow.name)S.rep=Object.assign({name:'',email:'',phone:''},S.rep,{name:hsStr(ow.name),email:hsStr(ow.email,120),phone:hsStr(ow.phone,40)});
  if(dl.name&&(!S.subject||S.subject===t('def_subject')))S.subject=hsStr(dl.name,150);
  S.hubspot=Object.assign({},HS.ctx);                 // salvato con l'offerta: serve a riportare il risultato sul Deal giusto
  HS.active=true;
  if(typeof step!=='undefined'&&step===0&&typeof render==='function')render();
  return true;
}
window.addEventListener('message',ev=>{
  if(!hsOriginOk(ev.origin)||ev.source!==window.parent)return;
  const d=ev.data;
  if(d&&d.source==='yacht-configurator'&&d.v===1&&d.type==='context')hsApply(d.payload);
});
// ricerca clienti nel CRM (autocompletamento del passo 1): il backend del cliente interroga HubSpot, qui non passa nessun token HubSpot
async function hsSearchClients(q){
  if(!HS.active||!HS.apiBase||!HS.token)return null;
  try{
    const r=await fetch(HS.apiBase+'/clients?q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+HS.token},cache:'no-store'});
    if(!r.ok)return null;
    const j=await r.json();
    return (Array.isArray(j.clients)?j.clients:[]).slice(0,40).map(c=>({company:hsStr(c.company),contact:hsStr(c.contact),role:hsStr(c.role),email:hsStr(c.email,120),phone:hsStr(c.phone,40)}));
  }catch(_){return null;}
}
function hsBannerHtml(){
  if(!HS.active||!HS.ctx)return '';
  return `<div class="hsbar">🔗 ${L2('Dati dal CRM HubSpot','Data from HubSpot CRM')}${HS.ctx.dealName?` · <b>${esc(HS.ctx.dealName)}</b>`:''}${HS.ctx.dealId?` <span>Deal #${esc(HS.ctx.dealId)}</span>`:''}</div>`;
}
// la scheda sa che il configuratore è pronto a ricevere i dati (si scrive solo a un'origine HubSpot nota)
try{
  if(window.parent!==window&&document.referrer){const o=new URL(document.referrer).origin;if(hsOriginOk(o))window.parent.postMessage({source:'yacht-configurator',v:1,type:'ready'},o);}
}catch(_){}
</script>
<script>
/* Configuratore Yacht — modulo "init" */
/* ============== INIT ============== */
$('#brandLogo').innerHTML=logoLight(30);
setupLoader();
$('#dashBtn').onclick=()=>toggleDashboard(!DASH);
$('#offersBtn').onclick=openOfferList;
loadRegistryLocal();
settingsInit();
applyNextOfferNumber();
ghInit();
if(!S.delivery)S.delivery=t('def_delivery');
if(!S.packaging)S.packaging=t('def_packaging');
if(!S.payment)S.payment=t('def_payment');
$('#langSel').value=LANG;
if(CLIENTS.length&&$('#cliTxt'))$('#cliTxt').textContent='✓ '+CLIENTS.length+' '+t('clients');
render();
restoreFolder();

// Prezzi e optional: si caricano da soli da data/ (sito pubblicato: dist/data/) oppure da data-private/ (sviluppo locale).
// Se i file non ci sono, si caricano a mano dall'ingranaggio ⚙ (Carica listino / Carica matrice optional).
async function fetchFirst(name){
  for(const dir of ['data/','data-private/']){
    try{const r=await fetch(dir+name,{cache:'no-cache'});if(r.ok&&!/text\/html/.test(r.headers.get('content-type')||''))return await r.arrayBuffer();}catch(e){}
  }
  return null;
}
// la libreria Excel si carica in parallelo alla pagina (async): prima di leggere i listini si aspetta che sia pronta
function xlsxReady(){return window.XLSX?Promise.resolve():new Promise(r=>{const t=setInterval(()=>{if(window.XLSX){clearInterval(t);r();}},25);});}
async function autoLoadPrivate(){
  if(!/^https?:/.test(location.protocol))return;
  try{
    await xlsxReady();
    const a=await fetchFirst('01_Listino_Prezzi_Ferretti.xlsx');
    if(a)applyXlsxBuffer(a,'01_Listino_Prezzi_Ferretti.xlsx');
    const b=await fetchFirst('02_Matrice_Optional_Ferretti.xlsx');
    if(b){applyMatrixWorkbook(XLSX.read(b,{type:'array'}),'02_Matrice_Optional_Ferretti.xlsx');if($('#matTxt'))$('#matTxt').textContent='✓ 02_Matrice_Optional_Ferretti.xlsx';render();}
  }catch(e){console.warn('listini non caricati',e);}
  try{ensureDemoSeed();}catch(e){console.warn('demo',e);}   // offerte demo: caricate da sole, a listino pronto
}
autoLoadPrivate();

// cambio: si verifica alla prima apertura di ogni giorno
fxRefresh().then(ok=>{if(ok&&S.cur&&S.cur!=='EUR'&&!S.fxRate){fxSelect(S.cur);} if(typeof step!=='undefined'&&step===3)render();});
</script>
