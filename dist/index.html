<style>
/* ==========================================================================
   AZIMUT YACHTS — design tokens (kit brand ufficiale, vedi brand/BRAND_GUIDELINES.md)
   Antracite #1D1D1B · Rosso #C21632 (unico accento) · grigi · Helvetica Neue / Arial
   I nomi --red/--navy sono storici del configuratore (ereditato da Depureco/Ferretti).
   ========================================================================== */
:root{
  --red:#C21632; --red-700:#9A1127; --red-300:#D9677A; --red-100:#F6DDE1;
  --navy:#1D1D1B; --navy2:#2B2B29;
  --yellow:#D7D8DB; --yellow-700:#A1A3A5; --yellow-100:#EBECED;   /* grigi (nessun giallo nel brand) */
  --ink:#1D1D1B; --line:#C3C6CA; --soft:#EBECED; --muted:#6E6E6F; --white:#fff;
  --steel:#6E6E6F; --steelL:#A1A3A5; --greybar:#EBECED; --valtint:#C3C6CA;
  --font-body:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-title:'Helvetica Neue',Helvetica,Arial,sans-serif;
  --font-accent:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--ink);background:#fff}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.app-hide{display:none!important}

/* titoli: Helvetica Neue Light, maiuscolo, spaziatura ampia (kit brand Azimut) */
.topbar h1,.card h2,.hbar .r,.hbar .l,.cover .ctitle,.gc-title,.load-title,.sol .head .nm,.cat .ttl{
  font-family:var(--font-title);font-weight:300;letter-spacing:.06em;text-transform:uppercase}
.topbar h1{font-size:17px;font-weight:500}.card h2{font-size:22px;font-weight:300;letter-spacing:.03em}.hbar .r{font-size:16px}.hbar .l{font-size:14px}
.cover .ctitle{font-size:24px;font-weight:300}.cover .ctitle .nm{font-size:28px;font-weight:400}
.gc-title{font-size:16px}.sol .head .nm{font-size:18px}.cat .ttl{font-size:15px}
.hint,.cd{font-family:var(--font-body)}
/* accenti */
.step.active{border-color:var(--red)}
.btn.prim{box-shadow:none}
</style>
<style>
/* Configuratore Yacht — layout e componenti */
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-body);color:var(--ink);background:#f5f5f5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.app-hide{display:none!important}

/* ── top bar ── */
.topbar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:18px;
  padding:10px 22px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topbar .brand{display:flex;align-items:center;gap:10px}
.topbar svg{display:block}
.topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.3px}
.topbar .spacer{flex:1}
.lang-wrap,.list-wrap{display:flex;align-items:center;gap:6px;font-size:12px}
.lang-wrap select,.list-wrap select{background:var(--navy2);color:#fff;border:1px solid #4a4a4a;
  border-radius:6px;padding:6px 9px;font-size:12px;font-weight:600}
.list-wrap select{min-width:60px}

/* ── stepper ── */
.stepper{display:flex;gap:6px;background:#fff;padding:12px 22px;border-bottom:1px solid var(--line);
  flex-wrap:wrap;position:sticky;top:54px;z-index:40}
.step{display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:30px;font-size:13px;
  font-weight:600;color:var(--muted);background:var(--soft);border:1px solid transparent}
.step .n{width:22px;height:22px;border-radius:50%;background:#cfcfcf;color:#fff;display:grid;
  place-items:center;font-size:12px;font-weight:700}
.step.active{color:var(--navy);background:#f6e6e5;border-color:#dbb4b3}
.step.active .n{background:var(--red)}
.step.done .n{background:var(--navy)}
.step.clickable{cursor:pointer}

/* ── layout ── */
.wrap{max-width:1080px;margin:0 auto;padding:26px 22px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.card .hint{margin:0 0 18px;color:var(--muted);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr)}
.grid>*{min-width:0}
@media(max-width:720px){.g2,.g3{grid-template-columns:1fr}}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#4a4a4a}
label.fld input,label.fld select,label.fld textarea{width:100%;min-width:0;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;font-weight:400;color:var(--ink);background:#fff}
label.fld input:focus,label.fld textarea:focus,label.fld select:focus{outline:none;border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(23,23,23,.08)}
textarea{resize:vertical;min-height:80px}

/* ── nav buttons ── */
.navbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:12px;padding:12px 22px;z-index:45}
.navbar .inner{max-width:1080px;margin:0 auto;width:100%;display:flex;justify-content:space-between;gap:12px}
.btn{padding:11px 22px;border-radius:9px;border:none;font-size:14px;font-weight:700}
.btn.prim{background:var(--red);color:#fff}
.btn.prim:hover{background:#8c1412}
.btn.ghost{background:var(--soft);color:var(--navy)}
.btn.ghost:hover{background:#e4e4e4}
.btn.nav{background:var(--navy);color:#fff}
.btn.nav:hover{background:#292929}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:7px 13px;font-size:12.5px}

/* ── product browser ── */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;background:#fff;
  transition:.12s}
.cat:hover{border-color:var(--navy);box-shadow:0 4px 14px rgba(23,23,23,.1)}
.cat.sel{border-color:var(--red);background:#f1f5f6}
.cat .ttl{font-weight:800;color:var(--navy);font-size:15px}
.cat .cnt{font-size:11.5px;color:var(--muted);margin-top:3px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:9px;margin:14px 0}
.mlist{display:flex;flex-direction:column;gap:8px;max-height:430px;overflow:auto;padding-right:4px}
.mrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;padding:11px 14px}
.mrow:hover{border-color:var(--navy)}
.mrow .info{flex:1;min-width:0}
.mrow .nm{font-weight:700;color:var(--navy);font-size:14px}
.mrow .meta{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .pr{font-weight:800;color:var(--ink);font-size:14px;white-space:nowrap}
.badge{display:inline-block;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;
  padding:2px 7px;border-radius:20px;letter-spacing:.4px;vertical-align:middle}
.badge.code{background:var(--soft);color:var(--navy);font-weight:700}

/* ── solutions ── */
.sol{border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:14px;background:#fbfbfb}
.sol .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sol .head .nm{font-weight:800;color:var(--navy);font-size:16px}
.sol .head .cd{font-size:12px;color:var(--muted)}
.acc-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,2.6fr) minmax(0,.7fr) minmax(0,1fr) minmax(0,.8fr) 30px;gap:8px;min-width:0;margin-top:8px;align-items:center}
.mvbtns{display:inline-flex;gap:4px}
.mvbtns .xbtn{background:var(--steel);font-size:10px}
.mvbtns .xbtn:disabled{opacity:.3;cursor:default}
.optgrp{margin:6px 0 8px}
.optgrp-t{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#fff;background:var(--steel);display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;margin-bottom:5px;cursor:pointer;list-style:none}
.optgrp-t::-webkit-details-marker{display:none}
.optgrp-t::before{content:'▸';font-size:10px;transition:transform .15s}
.optgrp[open]>.optgrp-t::before{transform:rotate(90deg)}
.optgrp>.optchips{margin-top:6px}
.optchips{display:flex;flex-wrap:wrap;gap:6px}
.chip.opt{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;max-width:260px;padding:6px 10px;line-height:1.25}
.chip.opt .oc{font-weight:800}.chip.opt .od{font-size:10.5px;color:#6f6f6f;font-weight:400;white-space:normal}.chip.opt .op{font-size:11px;color:var(--navy);font-weight:700}
.chip.opt.chk{border-color:#d97706;background:#fff8ec}
.acc-head{font-size:10.5px;font-weight:700;color:#6f6f6f;text-transform:uppercase;letter-spacing:.3px;margin-top:8px;padding-left:48px}
.fl{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;color:#6f6f6f;text-transform:uppercase;letter-spacing:.3px}
.acc-row>*{min-width:0}
.acc-row input{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:7px}
@media(max-width:720px){.acc-row{grid-template-columns:1fr 1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;background:#efefef;color:var(--navy);
  border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;margin:3px 4px 0 0}
.chip button{border:none;background:none;color:var(--red);font-weight:800;font-size:14px;line-height:1}
.xbtn{border:none;background:#e3ecee;color:var(--red);border-radius:7px;width:30px;height:30px;font-weight:800;z-index:5;cursor:pointer}
.addbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.imgthumb{width:62px;height:62px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.drawer{position:fixed;top:118px;right:0;width:286px;max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-right:none;border-radius:12px 0 0 12px;box-shadow:-8px 0 24px rgba(23,23,23,.12);z-index:40;transition:transform .22s ease}
.drawer .dhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800;color:var(--navy);font-size:13px;position:sticky;top:0;background:#fff}
.drawer .dbody{padding:8px 12px 14px}
.drawer .ditem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f0f2f5}
.drawer .ditem .nm{font-size:12px;font-weight:700;color:#1f1f1f;line-height:1.25}
.drawer .ditem .cd{font-size:10.5px;color:#6f6f6f}
.drawer.closed{transform:translateX(calc(100% - 40px))}
.drawer .dtab{position:absolute;left:-1px;top:0;height:100%;width:40px;display:none;align-items:center;justify-content:center;cursor:pointer;background:var(--red);color:#fff;border-radius:12px 0 0 12px;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:11.5px}
.drawer.closed .dtab{display:flex}
.drawer.closed .dhead,.drawer.closed .dbody{visibility:hidden}
@media print{.drawer{display:none!important}}

/* ── preview / offer document ── */

.doc-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fileinfo{font-size:12px;color:var(--muted)}
.pages{background:#5c5c5c;padding:22px;border-radius:12px}
.page{width:210mm;min-height:297mm;background:#fff;margin:0 auto 18px;position:relative;
  padding:0;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25);font-size:11.5px;color:#222}
.page .pad{padding:16mm 15mm 26mm}
/* footer band with curved white notch on the right + red web address */
.page .foot{position:absolute;left:0;right:0;bottom:0;height:46px;background:var(--navy);
  color:#d0d0d0;font-size:7.2px;line-height:1.5;display:flex;align-items:center;
  justify-content:space-between;padding:0 15mm}
.page .foot b{color:#fff}
.page .foot .web{color:var(--yellow);font-weight:800;font-size:9px;position:relative;z-index:3;margin-right:18px}
.page .foot .notch{position:absolute;right:0;bottom:0;width:110px;height:46px;
  background:#fff;border-top-left-radius:46px;z-index:1}
.plogo{margin-bottom:12mm}

/* cover */
.cover{background:var(--navy);color:#fff}
.cover .clogo{position:absolute;top:18%;left:0;right:0;text-align:center}
.cover .clogo svg{margin:0 auto}
.cover .ctitle{position:absolute;top:50%;left:0;right:0;text-align:center;font-size:19px;
  font-weight:300;letter-spacing:1.5px}
.cover .ctitle .nm{margin-top:10px;font-size:17px;letter-spacing:2px}
.cover .symbol{position:absolute;left:-40px;right:auto;bottom:-30px;width:430px;height:430px;z-index:0;opacity:.82;transform:scaleX(-1)}
.cover .contact{position:absolute;right:48px;bottom:150px;color:#fff;font-size:10.5px;
  line-height:1.9;z-index:3;text-align:left;text-shadow:0 1px 3px rgba(8,14,28,.85)}
.cover .contact b{display:block;font-size:10.5px;font-weight:800;letter-spacing:1px;margin-bottom:5px}
.cover .contact a{color:var(--yellow);text-decoration:none}

/* generic two-column section header bar (steel-blue + grey) */
.hbar{display:grid;grid-template-columns:33% 1fr;gap:8px;margin:7mm 0 5mm}
.hbar .l{background:var(--steel);color:#fff;padding:9px 14px;font-size:11.5px;font-weight:500;
  letter-spacing:.3px}
.hbar .r{background:var(--greybar);color:var(--navy);padding:9px 14px;font-size:13px;font-weight:800;
  display:flex;align-items:center}

/* letter page */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:8mm 0 9mm}
.info-l .ir{background:var(--steel);color:#fff;padding:9px 13px;font-size:11px;margin-bottom:6px}
.info-l .ir b{color:#fff;font-weight:600}
.info-l .ir .v{color:#cdd6e2;font-weight:400}
.info-r{border:1px dashed #bdbdbd;padding:16px 18px;font-size:11px;line-height:2.15}
.info-r .nm{font-weight:800;color:var(--navy);font-size:12px;margin-bottom:6px}
.info-r b{color:#5a5a5a;font-weight:600}
.info-r .v{color:#8f8f8f}
.subj-bar{background:var(--steel);color:#fff;padding:10px 14px;font-weight:600;font-size:12px;margin-bottom:9px}
.date-bar{display:inline-block;background:var(--steel);color:#fff;padding:8px 18px;font-weight:600;
  font-size:12px;margin-bottom:16px}
.letter-box{border:1px solid var(--line);padding:20px 22px;line-height:2.4;font-size:11.5px;min-height:55mm}
.sign{text-align:center;margin:30px 0 0;margin-right:8mm;line-height:2;font-size:11.5px;
  display:flex;flex-direction:column;align-items:flex-end}
.sign span{display:block;text-align:center;min-width:160px}

/* solution page */
.prod-grid{display:grid;grid-template-columns:185px 1fr;gap:18px;align-items:start;margin-top:2mm}
.prod-img{width:185px;height:225px;object-fit:contain;border:1px solid var(--line);background:#fff}
.prod-img.empty{display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center;padding:10px}
.prod-ttl{font-weight:700;font-size:12.5px}
.prod-ttl b{font-weight:800}
.prod-sub{font-size:12px;margin:3px 0 4px}
.atexrow{display:flex;align-items:flex-start;gap:14px;justify-content:space-between}
.atexrow .marks{display:flex;gap:5px;flex-shrink:0;margin-top:2px}
.atexbadge{border:1px solid #bdbdbd;border-radius:2px;padding:3px 5px;font-size:7px;font-weight:800;
  color:var(--navy);text-align:center;line-height:1.2;background:#fff;min-width:26px}
.atexbadge.ex{color:var(--red);border-color:var(--red)}
.prod-grid ul{margin:8px 0 0;padding-left:16px;line-height:1.75;font-size:11.3px}
.mark{color:var(--red);font-weight:700}
.acc-bar{display:grid;grid-template-columns:33% 1fr;gap:8px;margin:6mm 0}
.acc-bar .l{background:var(--steel);color:#fff;padding:14px;font-size:11.5px;display:grid;
  place-items:center;text-align:center;letter-spacing:.3px}
.acc-bar .r{background:var(--greybar);padding:13px 15px;font-size:10.5px;line-height:1.6;color:#2b2b2b}
.acc-bar .r .kit{font-weight:800;color:var(--navy)}
.ptable{width:100%;border-collapse:collapse;margin-top:4px;font-size:11px}
.ptable th{background:var(--steel);color:#e6e6e6;padding:9px 12px;text-align:left;font-weight:500;font-size:10.5px}
.ptable th.r,.ptable td.r{text-align:right}
.ptable th.c,.ptable td.c{text-align:center}
.ptable td{padding:8px 12px;border-bottom:1px solid #e5e5e5;color:#2b2b2b}
.ptable td.pdesc{font-size:10px;color:#555555;max-width:230px;line-height:1.35}
.ptable td.pimg{width:44px;padding:4px 6px}
.ptable td.pimg img{width:38px;height:38px;object-fit:contain;display:block}
.addimg{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px dashed #dbb4b3;border-radius:6px;font-size:10px;color:#7a7a7a;cursor:pointer;background:#f7f7f7;text-align:center;line-height:1.1}
.addimg:hover{background:#f3f3f3;border-color:var(--navy)}
.pe{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.ce{cursor:text;border-radius:2px}
.ce:hover{background:#f2f6fd}
.ce:focus{outline:2px solid var(--red);background:#fff;padding:0 2px}
.ce:empty::before{content:'…';color:#b0b8c6}
@media print{.ce{outline:none!important;background:none!important;padding:0}.ce:empty::before{content:''}}
body.exporting .ce{outline:none!important;background:none!important;padding:0}
body.exporting .ce:empty::before{content:''}
body.exporting .specdel{display:none!important}
body.exporting .app-noprint{display:none!important}
.prodedit summary{list-style:none}.prodedit summary::-webkit-details-marker{display:none}
.specdel{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border-radius:50%;background:#e8ecf2;color:#8592a8;font-size:11px;line-height:1;cursor:pointer;vertical-align:middle}
.specdel:hover{background:var(--red);color:#fff}

.totbar{background:var(--steelL);color:#fff;display:flex;justify-content:space-between;
  padding:11px 14px;font-weight:800;font-size:13px;margin-top:0}
.totblock .totline{display:flex;justify-content:space-between;padding:7px 14px;font-size:11.5px;color:#2b2b2b;border-bottom:1px solid #e5e5e5}
.totbar.pkg{background:var(--navy);margin-top:6px}

/* supply / general */
.supply{width:100%;border-collapse:collapse;font-size:11px;margin-top:2mm}
.supply td{border:1px solid var(--line);padding:9px 13px}
.supply td:first-child{width:38%;color:#6f6f6f;text-transform:uppercase;font-size:10px;letter-spacing:.4px}
.excl-box{border:1px solid var(--line);padding:6px 8px;margin-top:1mm}
.excl-box ul{margin:6px 0;padding-left:22px;line-height:1.9}
.gc{font-size:9px;line-height:1.6;color:#333;text-align:justify;margin-top:3mm}
.gc p{margin:0 0 6px}
.gc b{color:#222}
.gc-title{font-weight:800;color:var(--navy);font-size:12px;margin:1mm 0 3mm}
.gc-terms{font-size:8px;line-height:1.5;color:#333;text-align:justify;columns:2;column-gap:7mm}
.gc-terms .gc-c{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:7px}
.gc-terms .gc-h{display:block;font-weight:800;color:var(--navy);font-size:8.5px;margin-bottom:2px}

/* terms page: grow with content and keep the footer in normal flow so 2-column text never hides under the navy bar */

/* presentazione modelli nel documento: pagina intera, stile editoriale */

  background:linear-gradient(180deg,rgba(20,22,21,0) 45%,rgba(20,22,21,.72) 100%);color:#fff}

.pres-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm 6mm;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4mm 0;margin-bottom:5mm}
.pres-figs div{display:flex;flex-direction:column}

  /* scheda imbarcazione e righe optional */

/* scheda imbarcazione in sola lettura nel passo Opzioni */
.solro{display:flex;gap:12px;align-items:center;margin:8px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft)}

.solro b{font-family:var(--font-title);font-weight:400;font-size:16px;letter-spacing:.03em;text-transform:uppercase}

/* ============ DOCUMENTO A4 — design editoriale ============ */
.page{font-family:var(--font-body);color:#262826}
.plogo{margin-bottom:10mm}
/* piè di pagina leggero */
.page .foot{background:transparent;color:#7b807f;border-top:1px solid var(--line);height:34px;margin:0 15mm;padding:0;left:0;right:0;bottom:8mm;font-size:6.8px;letter-spacing:.02em}

.page.terms .foot{margin:10mm 0 0;padding:9px 0;position:static}
.page.pres .foot{position:absolute}
/* titoli di sezione: tipografici, senza barre */
.hbar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:8mm 0 4mm;padding-bottom:5px;border-bottom:1px solid var(--navy)}
.hbar .l{background:none;color:var(--muted);padding:0;font-size:8.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase}
.hbar .r{background:none;color:var(--navy);padding:0;font-size:13px;font-weight:400;font-family:var(--font-title);letter-spacing:.04em;text-transform:uppercase;display:block}

/* copertina */
.page.cover{background:var(--navy);color:#fff}
.cv-hero{position:absolute;top:0;left:0;width:100%;height:178mm;object-fit:cover;object-position:50% 60%}
.cv-shade{position:absolute;top:0;left:0;right:0;height:180mm;background:linear-gradient(180deg,rgba(29,29,27,.55) 0%,rgba(29,29,27,0) 26%,rgba(29,29,27,0) 58%,#212322 100%)}

.cv-client{font-family:var(--font-accent);font-style:italic;font-size:26px;opacity:.96}
.cv-foot{position:absolute;left:16mm;right:16mm;bottom:14mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;line-height:1.7;border-top:1px solid rgba(255,255,255,.35);padding-top:4mm}
.cv-foot span{display:block;font-size:7.5px;letter-spacing:.26em;opacity:.75}
.cv-foot b{display:block;font-weight:500;font-size:12px}
.cv-web{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase}
.cover .symbol{opacity:.5}

/* lettera */
.lt-eyebrow{font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.lt-subject{font-family:var(--font-accent);font-style:italic;font-size:30px;line-height:1.15;color:var(--red);margin:4mm 0 10mm;max-width:150mm}

/* scheda soluzione */
.sl-eyebrow{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);padding-bottom:5px;border-bottom:1px solid var(--navy);margin-bottom:5mm}

/* tabella prezzi: pulita, prezzi sempre su una riga */

.totblock{margin-top:4mm;margin-left:auto;width:100mm}

<style>
/* ==========================================================================
   AZIMUT — tema dell'applicazione (non tocca le pagine A4 del documento)

:root{

.topbar .btn.sm::after{content:'';position:absolute;left:10px;right:10px;bottom:3px;height:1px;background:var(--lx-gold);transform:scaleX(0);transform-origin:left;transition:transform .25s var(--lx-ease)}
.lang-wrap select{background:transparent;color:var(--lx-ink);border:none;border-bottom:1px solid var(--lx-line);border-radius:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:400}

.card{background:var(--lx-paper);border:1px solid var(--lx-line);border-radius:2px;padding:44px 48px;margin-bottom:26px;box-shadow:0 40px 70px -56px rgba(29,29,27,.18)}

/* ── campi: solo filetto inferiore ── */

.search:focus{outline:none;border-bottom-color:var(--lx-gold)}

/* ── pulsanti ── */
.btn{border-radius:0;font-family:var(--lx-sans);font-size:10.5px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;padding:15px 30px;transition:background-color .2s,color .2s,border-color .2s,transform .12s var(--lx-ease)}

.btn.prim:hover{background:var(--lx-petrol)}

.btn.ghost{background:transparent;color:var(--lx-ink);border:1px solid var(--lx-line)}
.btn.ghost:hover{border-color:var(--lx-gold);background:transparent}
.btn.sm{padding:10px 18px;font-size:9.5px}

.navbar .inner{max-width:1180px}
.chip{border:1px solid var(--lx-line);background:transparent;border-radius:0;font-family:var(--lx-sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px;cursor:pointer;color:var(--lx-ink);transition:border-color .2s,background-color .2s,color .2s}
.chip.sel{background:var(--lx-ink)!important;color:#fff!important;border-color:var(--lx-ink)}

/* ── soluzioni, righe, riquadri interni ── */
.sol{background:#fff;border:1px solid var(--lx-line);border-radius:2px;padding:26px}

.pcrumbs{display:flex;gap:0;margin:22px 0 34px;border-top:1px solid var(--lx-line);border-bottom:1px solid var(--lx-line)}

.phead{margin-bottom:28px}
.peyebrow{font-family:var(--lx-sans);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--lx-gold-d)}

.ptile:active{transform:scale(.985)}
.psym{font-family:var(--lx-serif);font-size:88px;line-height:.9;color:var(--lx-gold);margin-bottom:auto}

@keyframes lxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.pstage.leaving{opacity:0;transform:translateY(-6px)}
.pstage.in .phead,.pstage.in .pfilters,.pstage.in .search,.pstage.in .ptile,.pstage.in .mcard{animation:lxRise .28s var(--lx-ease) both;animation-delay:calc(var(--i,0)*45ms)}

const ISSUER_FIELDS=[['legalName','f_i_legal'],['address0','f_i_addr1'],['address1','f_i_addr2'],['tel','f_i_tel'],['email','f_i_mail'],['vat','f_i_vat'],['web','f_i_web']];
const ISSUER_LS='yacht_issuer_v1';
function issuerGet(k){return k==='address0'?BRAND.address[0]:k==='address1'?BRAND.address[1]:BRAND[k]||'';}
function issuerSet(k,v,silent){
  if(k==='address0')BRAND.address[0]=v;else if(k==='address1')BRAND.address[1]=v;else BRAND[k]=v;
  try{localStorage.setItem(ISSUER_LS,JSON.stringify(Object.fromEntries(ISSUER_FIELDS.map(([f])=>[f,issuerGet(f)]))));}catch(_){}
  if(!silent&&typeof setQueue==='function')setQueue();   // copia anche su GitHub
}
(function(){try{const o=JSON.parse(localStorage.getItem(ISSUER_LS)||'null');if(o)Object.keys(o).forEach(k=>{if(o[k]!=null)issuerSet(k,o[k]);});}catch(_){}})();

let DATA = JSON.parse(JSON.stringify(EMBEDDED));
let loadedFromFile=false, loadedFileName='';
const yr=new Date().getFullYear();
let step=0;
const S={
  rep:Object.assign({name:'',email:'',phone:''},DATA.reps[0]),   // copia: modificarlo non cambia l'elenco commerciali
  offerNum:BRAND.offerPrefix+String(yr).slice(2)+'-001',
  date:new Date().toLocaleDateString('it-IT'),
  client:'', contact:'', role:'', phone:'', email:'', subject:t('def_subject'),
  isRevisionOffer:false,
  intro:'',
  app:{use:'',area:'',guests:'',crew:'',flag:'',port:'',interior:'',notes:''},
  listino:'EUR',   // listino prezzi: EUR (L€) oppure USD (L$)
  solutions:[], // {code,name,desc,atex,unit,qty,img,specs:{}, accessories:[{code,desc,qty,price}]}
  discount:0, discount2:0, discount3:0,
  validity:'30', lead:'', delivery:'', packaging:'', warranty:'', incoterm:'Ex Works', payment:'', cur:'EUR', fxRate:1, fxDate:'', curShow:false,
  exclusions:'', notes:''
};
const STEPS=['customer','product','options','quote'];   // 1 Cliente · 2 Prodotto · 3 Opzioni · 4 Offerta

/* ============== EXTERNAL RESOURCES (images, clients, registry) ============== */
let IMGMAP={};        // normalizedCode -> File (loaded eagerly at folder-link time)
let IMGCACHE={};      // normalizedCode -> object URL (lazy, fast)
let CLIENTS=(EMBEDDED_CLIENTS||[]).slice();   // auto-loaded from embedded list (zero-click)
let REGISTRY={rows:[], fileHandle:null, fileName:''};
let CLIENTS_FILE={handle:null, name:''};   // writable handle to the source contacts file (when folder linked)
// Immagine predefinita del modello, scaricata dallo scraper come images/<Codice>.png (colonna Immagine_File).
// Nel file HTML "con immagini" le stesse immagini sono incorporate (IMAGES_EMBED).
function catalogImageUrl(k){
  const m=(DATA&&DATA.machines||[]).find(x=>imgKey(x.code)===k);
  if(!m||!m.imageFile)return '';
  if(typeof IMAGES_EMBED!=='undefined'&&IMAGES_ALIAS[m.imageFile]&&IMAGES_EMBED[IMAGES_ALIAS[m.imageFile]])return IMAGES_EMBED[IMAGES_ALIAS[m.imageFile]];
  return IMAGES_BASE+encodeURIComponent(m.imageFile);
}
// foto di presentazione (images/brochure/<Codice>-N.jpg): file locale oppure incorporata nel build "con immagini"
function photoUrl(f){
  if(typeof IMAGES_EMBED!=='undefined'&&IMAGES_ALIAS[f]&&IMAGES_EMBED[IMAGES_ALIAS[f]])return IMAGES_EMBED[IMAGES_ALIAS[f]];
  return IMAGES_BASE+f.split('/').map(encodeURIComponent).join('/');
}
// miniatura (600 px) di una foto: per gamme e schede modello, così la pagina si apre subito
function thumbUrl(f){return IMAGES_BASE+'thumb/'+String(f).split('/').pop();}
function imgKey(code){return String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function imgUrlForCode(code){
  const k=imgKey(code);
  if(IMGCACHE[k])return IMGCACHE[k];
  const f=IMGMAP[k];
  if(!f)return catalogImageUrl(k);   // nessuna cartella collegata: immagine del catalogo (cartella images/ o incorporata)
  const url=URL.createObjectURL(f);   // instant, no base64 decode
  IMGCACHE[k]=url;return url;
}
// per-solution image gallery: keep s.imgs[] and mirror the primary into s.img (used by document/word/drawer)
function ensureImgs(s){ if(!Array.isArray(s.imgs)) s.imgs = s.img ? [s.img] : []; s.img = s.imgs[0]||''; return s.imgs; }
function addSolImages(si, urls){ const s=S.solutions[si]; ensureImgs(s); urls.forEach(u=>{if(u)s.imgs.push(u);}); s.img=s.imgs[0]||''; }
// optionals & spare parts read from the price lists, specific to each model
function machineOptionals(code){return MACHINE_OPTIONALS[code]||[];}
function machineSpares(code){return MACHINE_SPARES[code]||[];}
function liteP(o){const e=o.price??o.l0??o.le;return S.listino==='USD'?(o.usd!=null&&o.usd!==''?o.usd:(e==null?e:usdOf(e))):e;}   // listino scelto al passo Prodotto: € oppure $
function addItem(si,o){
  if(S.solutions[si].accessories.find(x=>x.code===o.code))return;
  const item={code:o.code,desc:(typeof optDesc==='function'?optDesc(o):o.desc)||'',group:o.group||'Altro',qty:1,price:liteP(o)||0,img:''};
  S.solutions[si].accessories.push(item);
  const u=imgUrlForCode(o.code);if(u)item.img=u;
  stepOptions();
}
function nextProgressivo(){
  let max=0;REGISTRY.rows.filter(r=>!r.demo).forEach(r=>{const p=parseInt(r.prog||r.Progressivo||0,10);if(p>max)max=p;});   // le offerte demo non contano
  return max+1;
}
// numero offerta mostrato subito aggiornato (dopo la lettura del registro/GitHub)
function refreshOfferNumber(){
  const b=S.offerNum;applyNextOfferNumber();
  if(S.offerNum!==b){
    const i=document.querySelector('#i_offernum');if(i)i.value=S.offerNum;
    if(typeof step!=='undefined'&&step===3&&typeof stepQuote==='function')stepQuote();
  }
}
function applyNextOfferNumber(){
  // never clobber a recalled offer's "<original>_REVn" number with a fresh progressive one —
  // this refresh runs automatically (e.g. every time the Offer step renders) so without this
  // guard a revision number gets silently overwritten before the user even hits Save
  if(S.isRevisionOffer||/_REV\d+$/i.test(String(S.offerNum||'')))return;
  const n=nextProgressivo();
  S.offerNum=BRAND.offerPrefix+String(yr).slice(2)+'-'+String(n).padStart(3,'0');
}

/* ============== HELPERS ============== */
const $=s=>document.querySelector(s);
const ce=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
function money(n){n=Number(n)||0;const neg=n<0;n=Math.abs(n);const p=n.toFixed(2).split('.');const int=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'-':'')+int+','+p[1]+' €';}
function priceOf(m){return S.listino==='USD'?(Number(m.priceUsd)||usdOf(m.price)):(Number(m.price)||0);}
function L2(it,en){return LANG==='en'?en:it;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const SPEC_FIELDS=[['loa','loa'],['beam','beam'],['draft','draft'],['hull','hull'],['cabins','cabins'],
  ['engine','engine'],['speed','speed'],
  ['disp_empty','disp_empty'],['disp_full','disp_full'],['fuel','fuel'],['water','water'],['persons','persons']];
// unità aggiunte in automatico per le imbarcazioni PERSONALIZZATE quando si digita solo un numero
const SPEC_UNITS={loa:'m',beam:'m',draft:'m',hull:'m',disp_empty:'kg',disp_full:'kg',fuel:'l',water:'l'};
function withUnit(k,v,custom){v=String(v==null?'':v).trim();if(!v)return v;if(!custom||!SPEC_UNITS[k])return v;const chk=k==='dimensions'?v.replace(/[xh]/gi,''):v;return /[a-zA-Z]/.test(chk)?v:v+' '+SPEC_UNITS[k];}
function unitFor(k,v,custom){v=String(v==null?'':v).trim();if(!v||!custom||!SPEC_UNITS[k])return '';const chk=k==='dimensions'?v.replace(/[xh]/gi,''):v;return /[a-zA-Z]/.test(chk)?'':SPEC_UNITS[k];}

// numeri nel catalogo in formato italiano (22,5 m · 48.000 kg): in inglese si mostrano come 22.5 m · 48,000 kg
function locSpec(v){
  v=String(v==null?'':v);if(LANG!=='en')return v;
  return v.replace(/\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+,\d+/g,m=>m.replace(/[.,]/g,c=>c==='.'?',':'.'));
}
</script>
<script>
/* Configuratore Yacht — modulo "fx": valute e cambio.
   I prezzi (listino, registro, dashboard) sono SEMPRE in euro. La valuta scelta nel pannello «Prezzo netto» serve a lavorare
   l'importo finale (arrotondamento / prezzo manuale) e, se il flag è attivo, a mostrare il documento in quella valuta.
   Il cambio si controlla alla prima apertura di ogni giorno (open.er-api.com) e si ricorda; ogni offerta conserva il cambio usato. */
// [sigla, simbolo, codice paese della bandiera, nome]
const CURRENCIES=[['EUR','€','eu','Euro'],['USD','$','us','Dollaro USA'],['GBP','£','gb','Sterlina'],['CHF','CHF','ch','Franco svizzero'],['AED','AED','ae','Dirham EAU'],['CAD','C$','ca','Dollaro canadese'],['AUD','A$','au','Dollaro australiano'],
  ['SGD','S$','sg','Dollaro di Singapore'],['HKD','HK$','hk','Dollaro di Hong Kong'],['JPY','¥','jp','Yen'],['CNY','CN¥','cn','Yuan'],['NOK','kr','no','Corona norvegese'],['SEK','kr','se','Corona svedese']];
// bandiera come immagine (funziona su qualsiasi computer, a differenza delle emoji)
function flagImg(cc,w){return `<img class="flag" src="https://flagcdn.com/w40/${cc}.png" width="${w||22}" height="${Math.round((w||22)*0.75)}" alt="${cc.toUpperCase()}" loading="lazy">`;}
const FX_LS='yacht_fx_v1';
const FX={date:'',rates:{EUR:1},src:'',failed:false};
function fxLoad(){try{const o=JSON.parse(localStorage.getItem(FX_LS)||'null');if(o&&o.rates)Object.assign(FX,o);}catch(_){}}
function fxSave(){try{localStorage.setItem(FX_LS,JSON.stringify({date:FX.date,rates:FX.rates,src:FX.src}));}catch(_){}}
function fxToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// aggiorna il cambio se non è già di oggi (o se force). Ritorna true se i tassi sono di oggi.
async function fxRefresh(force){
  if(!force&&FX.date===fxToday()&&FX.rates.USD)return true;
  const srcs=[['https://open.er-api.com/v6/latest/EUR',j=>j&&j.result==='success'?j.rates:null],
              ['https://api.frankfurter.dev/v1/latest?base=EUR',j=>j&&j.rates?Object.assign({EUR:1},j.rates):null]];
  for(const [u,pick] of srcs){
    try{
      const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;
      const rates=pick(await r.json());
      if(rates&&rates.USD){FX.rates=Object.assign({EUR:1},rates);FX.date=fxToday();FX.src=new URL(u).host;FX.failed=false;fxSave();return true;}
    }catch(_){}
  }
  FX.failed=true;return false;
}
function curInfo(c){return CURRENCIES.find(x=>x[0]===c)||CURRENCIES[0];}
// cambio dell'offerta: quello salvato con l'offerta, altrimenti l'ultimo noto
function curRate(){const c=S.cur||'EUR';if(c==='EUR')return 1;return Number(S.fxRate)||Number(FX.rates[c])||0;}
function fxSelect(c){S.cur=c;if(c==='EUR'){S.fxRate=1;S.fxDate=FX.date;}else{S.fxRate=Number(FX.rates[c])||0;S.fxDate=FX.date;}}
// il documento è nella valuta scelta (se il cambio è noto)
function docCur(){return (S.cur&&S.cur!=='EUR'&&curRate())?S.cur:'EUR';}
function fmtCur(n,c){
  try{return new Intl.NumberFormat(LANG==='en'?'en-GB':'it-IT',{style:'currency',currency:c,currencyDisplay:'narrowSymbol'}).format(n);}
  catch(e){return Number(n).toFixed(2)+' '+c;}
}
// importo in euro -> testo nella valuta del documento
function moneyD(eur){const c=docCur();return c==='EUR'?money(eur):fmtCur((Number(eur)||0)*curRate(),c);}
// importo in euro -> testo in una valuta qualsiasi (anteprima nel pannello)
function moneyIn(eur,c){return c==='EUR'?money(eur):fmtCur((Number(eur)||0)*(c===S.cur?curRate():(Number(FX.rates[c])||0)),c);}
fxLoad();
</script>
<script>
/* Configuratore Yacht — modulo "steps-customer-application" */
/* ============== RENDER STEPPER ============== */
function renderStepper(){
  const sp=$('#stepper');sp.innerHTML='';
  STEPS.forEach((s,i)=>{
    const d=ce('div','step'+(i===step?' active':'')+(i<step?' done':'')+(i<=maxReached?' clickable':''));
    d.innerHTML=`<span class="n">${i<step?'✓':i+1}</span>${t('step_'+s)}`;
    if(i<=maxReached)d.onclick=()=>{step=i;render();};
    sp.appendChild(d);
  });
}
let maxReached=0;

/* ============== STEP 1: CUSTOMER ============== */
function stepCustomer(){
  const v=$('#view');
  ghRefreshSoon();
  const repOpts=DATA.reps.map(r=>`<option value="${esc(r.name)}">`).join('');
  v.innerHTML=`
  <div class="card">
    <h2>${t('step_customer')}</h2><p class="hint">${t('hint_customer')}</p>
    ${typeof hsBannerHtml==='function'?hsBannerHtml():''}
    <button class="btn prim" id="btnOffers" style="margin-bottom:12px;margin-right:8px">${LANG==='it'?'Richiama un\'offerta':'Recall an offer'}</button>
    ${window.showDirectoryPicker?`<button class="btn ghost" id="btnRecall" style="margin-bottom:12px">${t('recall_offer')}</button>`:''}
    <button class="btn ghost" id="btnRecallUpload" style="margin-bottom:12px">${t('recall_upload')}</button>
    <div class="grid g3">
      <label class="fld">${t('f_rep')}<input id="i_rep" list="repList" value="${esc(S.rep.name)}" autocomplete="off"><datalist id="repList">${repOpts}</datalist></label>
      <label class="fld">${t('f_repmail')}<input id="i_repmail" value="${esc(S.rep.email)}"></label>
      <label class="fld">${t('f_repphone')}<input id="i_repphone" value="${esc(S.rep.phone)}"></label>
    </div>
    <details class="issuer" style="margin-top:16px"><summary style="cursor:pointer;font-weight:700;font-size:12.5px;color:#4a4a4a">${t('f_issuer')}</summary>
      <div class="grid g3" style="margin-top:10px">
        ${ISSUER_FIELDS.map(([k,lbl])=>`<label class="fld">${t(lbl)}<input data-issuer="${k}" value="${esc(issuerGet(k))}"></label>`).join('')}
      </div>
    </details>
    <div class="grid g3" style="margin-top:14px">
      <label class="fld">${t('f_offernum')}<input id="i_offernum" value="${esc(S.offerNum)}"></label>
      <label class="fld">${t('f_date')}<input id="i_date" value="${esc(S.date)}"></label>
      <label class="fld">${t('f_subject')}<input id="i_subject" value="${esc(S.subject)}" placeholder="${esc(t('ph_subject'))}"></label>
    </div>
    <div class="grid g2" style="margin-top:14px">
      <label class="fld" style="position:relative">${t('f_client')} ${CLIENTS.length?'<span style="color:var(--muted);font-weight:400">· '+CLIENTS.length+' '+t('clients')+'</span>':''}
        <input id="i_client" value="${esc(S.client)}" autocomplete="off" placeholder="${CLIENTS.length?esc(t('ph_client_search')):''}">
        <div id="cliSugg" style="position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:20;max-height:230px;overflow:auto;display:none"></div>
      </label>
      <label class="fld">${t('f_contact')}<input id="i_contact" value="${esc(S.contact)}"></label>
      <label class="fld">${t('f_role')}<input id="i_role" value="${esc(S.role)}"></label>
      <label class="fld">${t('f_cphone')}<input id="i_phone" value="${esc(S.phone)}"></label>
      <label class="fld">${t('f_cemail')}<input id="i_email" value="${esc(S.email)}"></label>
    </div>
    <label class="fld" style="margin-top:14px">${t('f_intro')}
      <textarea id="i_intro" placeholder="${esc(t('intro_default'))}">${esc(S.intro)}</textarea></label>
  </div>`;
  // referente commerciale: tutto modificabile; se il nome coincide con un commerciale in elenco ne propone mail e telefono
  S.rep=Object.assign({name:'',email:'',phone:''},S.rep);
  $('#i_rep').oninput=e=>{S.rep.name=e.target.value;const r=DATA.reps.find(x=>x.name===e.target.value);if(r){S.rep.email=r.email||S.rep.email;S.rep.phone=r.phone||S.rep.phone;$('#i_repmail').value=S.rep.email;$('#i_repphone').value=S.rep.phone;}};
  $('#i_repmail').oninput=e=>{S.rep.email=e.target.value;};
  $('#i_repphone').oninput=e=>{S.rep.phone=e.target.value;};
  ['#i_rep','#i_repmail','#i_repphone'].forEach(id=>$(id).addEventListener('change',()=>{if(typeof repRemember==='function')repRemember();}));
  v.querySelectorAll('[data-issuer]').forEach(inp=>inp.oninput=e=>issuerSet(inp.dataset.issuer,e.target.value));
  if($('#btnOffers'))$('#btnOffers').onclick=openOfferList;
  if($('#btnRecall'))$('#btnRecall').onclick=recallOffer;
  if($('#btnRecallUpload'))$('#btnRecallUpload').onclick=openRecallUploadModal;
  const bind=(id,key)=>{$('#'+id).oninput=e=>S[key]=e.target.value;};
  bind('i_offernum','offerNum');bind('i_date','date');bind('i_subject','subject');
  bind('i_contact','contact');bind('i_role','role');
  bind('i_phone','phone');bind('i_email','email');bind('i_intro','intro');
  // client field with autocomplete from loaded clients file
  const ci=$('#i_client'), sg=$('#cliSugg');
  let hsT;
  function showSugg(){
    if(typeof HS!=='undefined'&&HS.active&&HS.apiBase){   // dati dal CRM HubSpot
      clearTimeout(hsT);hsT=setTimeout(async()=>{
        const res=await hsSearchClients(ci.value.trim());if(!res)return;
        CLIENTS=res;sg.innerHTML='';fillSugg(res);},200);return;}
    fillSugg(CLIENTS);
  }
  function fillSugg(all){
    if(!all.length){sg.style.display='none';return;}
    const q=ci.value.trim().toLowerCase();
    let list=all;
    if(q&&!(typeof HS!=='undefined'&&HS.active&&HS.apiBase))list=all.filter(c=>(c.company+' '+c.contact+' '+c.email).toLowerCase().includes(q));
    list=list.slice(0,40);
    if(!list.length){sg.style.display='none';return;}
    sg.innerHTML=list.map((c,i)=>`<div data-ci="${CLIENTS.indexOf(c)}" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f2f5;font-size:13px">

<script>
/* Configuratore Yacht — modulo "step-product" */
/* ============== STEP 3: PRODUCT ============== */
let curCat=null, curSub=null, curProt='', search='', showAllAcc={};
function catCounts(){const c={};DATA.machines.forEach(m=>c[m.category]=(c[m.category]||0)+1);return c;}
// ordine fisso delle categorie (catOrder dal catalogo); senza catOrder: per numero di modelli
function catOrderOf(c){const o=DATA.machines.filter(m=>m.category===c).map(m=>m.catOrder).filter(x=>x!=null);return o.length?Math.min(...o):999;}
// protezione: "ATEX INERT" conta come ATEX, "ACD INERT" come ACD
// filtro "Lunghezza": fascia calcolata dal catalogo (campo subcategory)
const BAND_ORDER=['Fino a 20 m','20–25 m','25–30 m','Oltre 30 m'];
function protOf(m){return m.subcategory||'—';}
function protBadge(m){return '';}
function subCounts(){const c={};DATA.machines.filter(m=>m.category===curCat&&(!curProt||protOf(m)===curProt)).forEach(m=>{const s=m.subcategory||m.family||'—';c[s]=(c[s]||0)+1;});return c;}
// Listino $ = listino € + 10% (se il listino barche ha una colonna Prezzo_USD, vale quella)
const USD_MARKUP=1.10;
function usdOf(e){return Math.round((Number(e)||0)*USD_MARKUP);}
// passo Prodotto a tre schermate: 0 listino · 1 gamma · 2 modello
let PSTEP=0, PANIM=false, PCHOSEN=false;
function machineImg(m){const f=(m.photos||[])[0]||m.imageFile;return f?thumbUrl(f):imgUrlForCode(m.code);}
function buildMachineListHtml(){
  let list=DATA.machines;
  if(curCat)list=list.filter(m=>m.category===curCat);
  if(curCat&&curSub)list=list.filter(m=>(m.subcategory||m.family||'—')===curSub);
  if(curProt)list=list.filter(m=>protOf(m)===curProt);
  if(search){const q=search.toLowerCase();list=list.filter(m=>(m.name+' '+m.code+' '+(m.family||'')+' '+(m.subcategory||'')+' '+(m.category||'')).toLowerCase().includes(q));}
  list=list.slice(0,300);
  const html=list.map((m,i)=>{
    const meta=[m.loa,m.cabins&&(m.cabins+' '+t('cabins_short'))].filter(Boolean).join(' · ');
    const img=machineImg(m),ex=S.solutions.find(x=>x.code===m.code);

<script>
/* Configuratore Yacht — modulo "step-options" */
const OPT_GROUP_ORDER=['Motorizzazione','Coperta','Interni','Elettronica','Comfort','Servizi','Altro'];
// gruppi optional a tendina: chiusi di default, quelli aperti dall'utente restano aperti dopo ogni aggiornamento
const OPT_OPEN=new Set();
const INCOTERMS=['Ex Works','FAS','CIF','DAP','DDP'];   // delivery condition
let OPT_CATALOG={};      // optional code -> {group,order,desc}
let MATRIX_INFO={file:'',machines:0};
function optGroupSlug(g){return String(g||'Altro').toLowerCase().replace(/[^a-z]+/g,'_').replace(/^_|_$/g,'');}
function optGroupLabel(g){return String(g||'Altro');}   // nomi dei gruppi sempre in italiano
// one price sheet: row "Codice Macchina" = optional codes, next row "Descrizione", then one row per machine (blank cell = not available)
function parseMatrixSheet(sheet){
  const aoa=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
  const hi=aoa.findIndex(r=>norm(r[0]).toLowerCase()==='codice macchina');if(hi<0)return null;
  const codes=aoa[hi].map(norm);
  const grpRow=(hi>0&&norm(aoa[hi-1][0]).toLowerCase()==='gruppo')?aoa[hi-1].map(norm):[];
  const di=(aoa[hi+1]&&norm(aoa[hi+1][0]).toLowerCase()==='descrizione')?hi+1:-1;
  const descs=di>=0?aoa[di].map(norm):[];
  const rows={};
  for(let i=(di>=0?di:hi)+1;i<aoa.length;i++){
    const r=aoa[i];const m=norm(r[0]);if(!m)continue;
    const o={};
    for(let j=1;j<codes.length;j++){if(!codes[j])continue;const v=r[j];if(v===''||v==null)continue;o[codes[j]]=num(v);}
    rows[m]=o;
  }
  return {codes,descs,grpRow,rows};
}
function applyMatrixWorkbook(wb,fileName){
  const find=k=>wb.SheetNames.find(n=>n.toLowerCase().includes(k));
  // listino unico: foglio "Optional_Prezzi" (compatibile con i vecchi fogli optional_l0 / optional_le)
  const sU=wb.SheetNames.find(n=>/usd/i.test(n)&&/optional/i.test(n));   // listino in dollari (foglio opzionale «Optional_Prezzi_USD»)
  const s0=wb.SheetNames.find(n=>/optional_prezzi$/i.test(n))||find('optional_l0')||find('l0'),sE=find('optional_le')||find('_le');
  const p0=s0?parseMatrixSheet(wb.Sheets[s0]):null,pE=sE?parseMatrixSheet(wb.Sheets[sE]):null,pU=sU?parseMatrixSheet(wb.Sheets[sU]):null;
  if(!p0&&!pE)return false;
  // catalogue (group / order / description per optional) + prices still to verify
  OPT_CATALOG={};
  const sC=find('catalogo');
  if(sC)sheetRows(wb.Sheets[sC],['codice']).forEach(r=>{const c=norm(r.Codice);if(c)OPT_CATALOG[c]={group:norm(r.Gruppo),order:num(r.Ordine),desc:norm(r.Descrizione),descIt:norm(r.Descrizione_IT),note:norm(r.Nota),noteIt:norm(r.Nota_IT)};});
  const CHECK=new Set();
  const sV=find('verific');
  if(sV)sheetRows(wb.Sheets[sV],['macchina']).forEach(r=>{const m=norm(r.Macchina),o=norm(r.Optional);if(m&&o)CHECK.add(m+'|'+o);});
  const hdrInfo={};
  [p0,pE,pU].forEach(p=>{if(!p)return;p.codes.forEach((c,j)=>{if(!c||j===0)return;hdrInfo[c]=hdrInfo[c]||{};if(p.descs[j]&&!hdrInfo[c].desc)hdrInfo[c].desc=p.descs[j];if(p.grpRow[j]&&!hdrInfo[c].group)hdrInfo[c].group=p.grpRow[j];});});
  const gOf=c=>{const g=(OPT_CATALOG[c]&&OPT_CATALOG[c].group)||(hdrInfo[c]&&hdrInfo[c].group)||'Altro';
    const hit=OPT_GROUP_ORDER.find(x=>x.toLowerCase()===g.toLowerCase());return hit||'Altro';};
  Object.keys(MACHINE_OPTIONALS).forEach(k=>delete MACHINE_OPTIONALS[k]);
  const machines=new Set([...Object.keys(p0?p0.rows:{}),...Object.keys(pE?pE.rows:{}),...Object.keys(pU?pU.rows:{})]);
  machines.forEach(m=>{
    const a0=(p0&&p0.rows[m])||{},aE=(pE&&pE.rows[m])||{},aU=(pU&&pU.rows[m])||{};
    const list=[...new Set([...Object.keys(a0),...Object.keys(aE),...Object.keys(aU)])].map(c=>({
      code:c,desc:(OPT_CATALOG[c]&&OPT_CATALOG[c].desc)||(hdrInfo[c]&&hdrInfo[c].desc)||'',desc_it:(OPT_CATALOG[c]&&OPT_CATALOG[c].descIt)||'',note:(OPT_CATALOG[c]&&OPT_CATALOG[c].note)||'',note_it:(OPT_CATALOG[c]&&OPT_CATALOG[c].noteIt)||'',
      l0:a0[c],le:aE[c],usd:aU[c],group:gOf(c),order:(OPT_CATALOG[c]&&OPT_CATALOG[c].order)||9999,check:CHECK.has(m+'|'+c)}));
    list.sort((x,y)=>OPT_GROUP_ORDER.indexOf(x.group)-OPT_GROUP_ORDER.indexOf(y.group)||x.order-y.order||x.code.localeCompare(y.code));
    MACHINE_OPTIONALS[m]=list;
  });
  MATRIX_INFO={file:fileName,machines:machines.size};
  return true;
}
// descrizione dell'optional nella lingua dell'offerta (il listino ufficiale è in inglese; l'italiano è la traduzione)

function handleMatrix(e){

    try{

}

function optSummaryHtml(si){

      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center"><button class="btn ghost sm" data-accadd="${si}" data-grp="Altro">+ ${L2('Customizzazione','Customization')}</button></div>`;

function optPaneHtml(si){

}
function optViewHtml(si){
  const s=S.solutions[si],cur=optTabOf(si),opts=machineOptionals(s.code),gs=optGroupsOf(s);
  const sd=lineTotals().sols[si];

    +`<button class="otab${cur==='SUMMARY'?' on':''}" data-otab="${si}|SUMMARY">${L2('Riepilogo','Summary')}<i data-ocnt="SUMMARY">${s.accessories.length||''}</i></button>`;

    <div class="ogrid${wide?' wide':''}">

      <div class="oright">${wide?'':`<div class="osearch"><input data-osearch="${si}" placeholder="${esc(L2('Cerca optional','Search items'))}" value="${esc(OPT_SEARCH[si]||'')}" autocomplete="off"><button class="btn ghost sm" data-oall="${si}" title="${esc(t('add_all_options'))}">+ ${esc(L2('tutti','all'))}</button></div>`}

// aggiorna totale, contatori delle schede e stato delle schede senza ridisegnare la pagina
function optRefresh(si){
  const root=optSolRoot(si);if(!root)return;
  const s=S.solutions[si],opts=machineOptionals(s.code),sd=lineTotals().sols[si];
  const cb=root.querySelector('.ocart b');if(cb&&sd)cb.textContent=moneyD(sd.solTot);
  OPT_GROUP_ORDER.forEach(g=>{const i=root.querySelector(`[data-ocnt="${g}"]`);if(i){const n=opts.filter(o=>(o.group||'Altro')===g&&optSel(s,o)).length;i.textContent=n||'';}});

}
function optToggle(si,code,on){
  const s=S.solutions[si],o=machineOptionals(s.code).find(x=>x.code===code);if(!o)return;
  const ai=s.accessories.findIndex(a=>a.code===code);
  if(!on){if(ai>=0)s.accessories.splice(ai,1);return;}
  if(ai>=0||!optPriceOk(o))return;
  const item={code:o.code,desc:optDesc(o),group:o.group||'Altro',qty:Math.max(1,+OPT_QTY[si+'|'+code]||1),price:Number(liteP(o))||0,img:''};

function wireOptPane(si){

function wireAccRows(v){
  v.querySelectorAll('[data-acc]').forEach(inp=>inp.oninput=e=>{
    const[si,ai,f]=inp.dataset.acc.split('-');S.solutions[si].accessories[ai][f]=(f==='qty'||f==='price')?+e.target.value:(f==='disc'?(e.target.value.trim()===''?null:e.target.value.trim()):e.target.value);optRefresh(+si);});

      sg.style.display='block';

        s.accessories.push(item);const _u=imgUrlForCode(acc.code);if(_u)item.img=_u;stepOptions();});

    inp.onblur=()=>setTimeout(()=>{if(sg)sg.style.display='none';},150);

}
function stepOptions(){
  const v=$('#view');
  if(!S.solutions.length){v.innerHTML=`<div class="card"><h2>${t('step_options')}</h2><p class="hint">${t('add_product_first')}</p></div>`;return;}

      ${editor}
      ${(s.sparesOnly||!s.custom)?'':`<div class="addbar" style="flex-wrap:wrap;gap:10px">
        <label class="btn ghost sm" style="display:inline-flex;align-items:center">${t('add_image')}
          <input type="file" accept="image/*" multiple style="display:none" data-imgadd="${si}"></label>
        ${imgs.map((u,ii)=>`<span style="position:relative;display:inline-block">
          <img class="imgthumb" src="${u}"${ii===0?' style="outline:2px solid var(--red);outline-offset:1px"':''}>
          ${ii!==0?`<button class="xbtn" data-imgmain="${si}-${ii}" title="Imposta come principale" style="position:absolute;left:-7px;top:-7px;background:#4a4a4a">★</button>`:''}
          <button class="xbtn" data-imgdel="${si}-${ii}" title="Rimuovi" style="position:absolute;right:-7px;top:-7px">✕</button>
        </span>`).join('')}
      </div>`}
      ${s.sparesOnly?`<div style="margin-top:10px">${optSummaryHtml(si)}</div>`:optViewHtml(si)}
    </div>`;
  }).join('');
  v.innerHTML=`
  <div class="card"><h2>${t('step_options')}</h2><p class="hint">${t('hint_options')}</p>${solHtml}</div>
  <div class="card"><h2>${t('commercial_terms')}</h2>
    <div class="grid g3">
      <label class="fld">${t('discount')} % (1°+2°+3°)
        <div style="display:flex;gap:6px;align-items:center">
          <input type="number" id="o_disc" value="${S.discount}" style="flex:1">
          <span style="color:#8592a8">+</span>
          <input type="number" id="o_disc2" value="${S.discount2||''}" placeholder="0" style="flex:1">
          <span style="color:#8592a8">+</span>
          <input type="number" id="o_disc3" value="${S.discount3||''}" placeholder="0" style="flex:1">
        </div>
      </label>
      <label class="fld">${t('sc_validity')}<input id="o_val" value="${esc(S.validity)}"></label>
      <label class="fld">${t('sc_lead')}<input id="o_lead" value="${esc(S.lead)}"></label>
      <label class="fld">${t('sc_incoterm')}<select id="o_inc">${INCOTERMS.map(x=>`<option value="${x}"${(S.incoterm||INCOTERMS[0])===x?' selected':''}>${x}</option>`).join('')}</select></label>
      <label class="fld">${t('sc_payment')}<input id="o_pay" value="${esc(S.payment)}" placeholder="${esc(t('def_payment'))}"></label>
    </div>
    <label class="fld" style="margin-top:14px">${t('exclusions')}
      <textarea id="o_excl" placeholder="${esc(t('def_exclusions'))}">${esc(S.exclusions)}</textarea></label>
    <label class="fld" style="margin-top:14px">${t('notes')}<textarea id="o_notes">${esc(S.notes)}</textarea></label>

  wireDrawer();

      r.onload=ev=>{urls[idx]=ev.target.result;if(--pending===0){addSolImages(si,urls);stepOptions();}};

</script>
<script>
/* Configuratore Yacht — modulo "quote" */
function discMultiplier(){return (1-(S.discount||0)/100)*(1-(S.discount2||0)/100)*(1-(S.discount3||0)/100);}
// solo gli sconti realmente applicati (es. «10» e non «0+10»); «0» se non ce ne sono
// descrizione in italiano di un optional del listino (anche per offerte salvate con testi in inglese)
function accItDesc(s,a){
  if(a.free||!a.code)return a.desc||'';
  const lists=[typeof machineOptionals==='function'?machineOptionals(s.code):[],...Object.values(MACHINE_OPTIONALS||{})];
  for(const l of lists){const o=(l||[]).find(x=>x.code===a.code);if(o&&(o.desc_it||o.desc))return optDesc(o);}
  return a.desc||'';
}
function genDiscParts(){return [S.discount,S.discount2,S.discount3].filter(x=>+x>0);}
function discLabel(){const p=genDiscParts();return p.length?p.join('+'):'0';}
// Sconto per riga: la macchina e ogni accessorio possono avere uno sconto EXTRA (item.disc, anche a più step "5+3")
// che si applica in cascata sopra lo sconto generale (passo Opzioni, condizioni commerciali).
// Lo sconto di riga è EXTRA: si somma (in cascata) allo sconto generale. Accetta uno o più step: "5" oppure "5+3".
function parseSteps(d){
  if(d==null||d==='')return [];
  return String(d).split(/[+;\/\s]+/).map(x=>parseFloat(String(x).replace(',','.'))).filter(x=>isFinite(x)&&x>0).map(x=>Math.min(100,x));
}
function itemMult(d){return discMultiplier()*parseSteps(d).reduce((m,x)=>m*(1-x/100),1);}
function itemDiscLabel(d){const all=[...genDiscParts(),...parseSteps(d)];return all.length?all.join('+'):'0';}
// Machines: by default each one is an ALTERNATIVE solution (customer picks one). A machine flagged
// sameOrder (S.solutions[i].sameOrder, i>0) belongs to the SAME ORDER as the previous one: they are
// quoted together and their totals add up. Consecutive machines linked this way form one "package".
// Prezzo netto (passo Offerta): % addizionale + arrotondamento oppure importo manuale. Si assorbe nel prezzo della barca,
// così il documento mostra solo cifre finali coerenti: nessuna traccia della trattativa nel PDF.
const NET_ROUND={none:0,cents:1,tens:10,hundreds:100,thousands:1000};
function netTarget(s,base){
  const n=s.net;if(!n)return base;
  if(Number(n.manual)>0)return Number(n.manual);          // prezzo manuale: salvato in euro
  const r=curRate()||1,step=NET_ROUND[n.round||'none']||0;   // arrotondamento: nella valuta scelta
  if(!step)return base;
  return Math.floor(base*r/step)*step/r;
}
function lineTotals(opts){
  opts=opts||{};
  const mult=discMultiplier();
  const sols=S.solutions.map(s=>{
    const rows=[];
    const mk=(o,d)=>{o.disc=itemDiscLabel(d);o.total=o.partial*itemMult(d);return o;};
    if(!s.sparesOnly)rows.push(mk({code:s.code,desc:s.tableDesc||s.name,unit:s.unit,qty:s.qty,partial:s.unit*s.qty,img:s.img},s.disc));
    const seenAcc=new Set();
    s.accessories.forEach(a=>{
      a=Object.assign({},a,{desc:accItDesc(s,a)});
      const key=String(a.code||'').trim().toLowerCase()+'|'+String(a.desc||'').trim().toLowerCase();
      if(key==='|'||seenAcc.has(key))return;   // niente righe vuote né doppioni
      seenAcc.add(key);
      rows.push(mk({code:a.code||(a.free?'Customizzazione':(a.group?optGroupLabel(a.group):a.desc)),desc:a.desc||'',descEn:accEnDesc(s,a),group:a.group||'Altro',unit:a.price,qty:a.qty,partial:a.price*a.qty,img:a.img},a.disc));});
    const baseTot=rows.reduce((x,r)=>x+r.total,0);
    if(!opts.noNet&&s.net&&!s.sparesOnly&&rows.length){
      const T=netTarget(s,baseTot),boat=rows[0],bm=itemMult(s.disc),nt=boat.total+(T-baseTot);
      if(nt>0&&bm>0&&(s.qty||1)>0){boat.total=nt;boat.unit=nt/((s.qty||1)*bm);boat.partial=boat.unit*(s.qty||1);}
    }
    const listTot=rows.reduce((x,r)=>x+r.partial,0);
    return {s,rows,listTot,baseTot,solTot:rows.reduce((x,r)=>x+r.total,0)};
  });
  const packages=[];
  sols.forEach((sd,i)=>{
    if(i>0&&sd.s.sameOrder)packages[packages.length-1].members.push(i);
    else packages.push({members:[i]});
  });
  packages.forEach((p,pi)=>{
    p.listTot=p.members.reduce((x,i)=>x+sols[i].listTot,0);
    p.net=p.members.reduce((x,i)=>x+sols[i].solTot,0);
    p.members.forEach((i,k)=>{sols[i].pkg=pi+1;sols[i].pos=k+1;sols[i].pkgSize=p.members.length;});
  });
  // registry total: with a single package it is the whole offer; with alternatives it is the first one
  const grand=packages.length?packages[0].net:0;
  return {sols,packages,grand,mult};
}
function solLabel(sd){return sd.pkgSize>1?`${t('solution')} ${sd.pkg}${String.fromCharCode(64+sd.pos)}`:`${t('solution')} ${sd.pkg}`;}

function totalsHtml(sd,pk,showPkg){
  const rows=[];

  const mk=(lbl,val,cls)=>`<div class="totline${cls?' '+cls:''}"><span>${lbl}</span><span>${val}</span></div>`;
  if(hasDisc){rows.push(mk(t('list_total'),moneyD(sd.listTot)));rows.push(mk(t('discount'),'−'+moneyD(sd.listTot-sd.solTot)));}
  rows.push(`<div class="totbar"><span>${t('total_general')}</span><span>${moneyD(sd.solTot)}</span></div>`);
  let h=`<div class="totblock">${rows.join('')}</div>`;

  return h;
}

// Price tables: when a machine page is taller than an A4 sheet, move the last rows (and the totals
// that follow the table) onto a continuation page, repeating logo, title bar and table header.
function repaginateQuote(){
  const A4H=297*96/25.4;
  const queue=[...document.querySelectorAll('#view .pages > .page')].filter(p=>p.querySelector(':scope > .pad > table.ptable'));
  while(queue.length){
    const p=queue.shift();
    const pad=p.querySelector(':scope > .pad'),foot=pad.querySelector(':scope > .foot'),table=pad.querySelector(':scope > table.ptable');
    if(!foot||!table)continue;
    // content must end where the page's bottom padding starts, so the sheet never grows beyond A4
    const limit=A4H-(parseFloat(getComputedStyle(pad).paddingBottom)||98);
    const bottomOf=()=>{const top=p.getBoundingClientRect().top;let m=0;[...pad.children].forEach(e=>{if(e!==foot)m=Math.max(m,e.getBoundingClientRect().bottom-top);});return m;};
    const rowsOf=()=>[...table.querySelectorAll('tr')].filter(r=>!r.querySelector('th'));
    let cont=null,guard=0;
    while(bottomOf()>limit&&rowsOf().length>1&&guard++<400){
      if(!cont){
        cont=document.createElement('div');cont.className=p.className;
        const cpad=document.createElement('div');cpad.className='pad';
        const logo=pad.querySelector(':scope > .plogo'),bar=pad.querySelector(':scope > .hbar, :scope > .sl-eyebrow');
        if(logo)cpad.appendChild(logo.cloneNode(true));
        if(bar)cpad.appendChild(bar.cloneNode(true));
        const ct=table.cloneNode(false);const head=table.querySelector('tr');if(head)ct.appendChild(head.cloneNode(true));
        cpad.appendChild(ct);
        // everything after the table (totals, order total) travels with the last rows
        let n=table.nextElementSibling;const tail=[];
        while(n&&n!==foot){tail.push(n);n=n.nextElementSibling;}
        tail.forEach(e=>cpad.appendChild(e));
        cpad.appendChild(foot.cloneNode(true));
        cont.appendChild(cpad);p.after(cont);
      }
      const ct=cont.querySelector('table.ptable');
      const last=rowsOf().pop();
      const firstMoved=ct.querySelectorAll('tr')[1];
      ct.insertBefore(last,firstMoved||null);
    }
    if(cont)queue.unshift(cont);
  }
}
// anteprima A4 (794 px) su schermi stretti: si riduce in scala per stare nella pagina (dopo l'impaginazione, che misura in px reali)
function fitPreview(){
  const p=document.querySelector('#view .pages');if(!p)return;
  p.style.zoom='';p.style.padding='';
  const avail=document.documentElement.clientWidth;
  if(avail<860){p.style.padding='6px 0';p.style.zoom=Math.max(.3,(avail-8)/794).toFixed(3);}
}

    <div class="hbar"><div class="l">${t('exclusions_supply')}</div><div class="r"></div></div>

  const gcPara=p=>{
    const t2=p.trim();

    if(/^timbro e firma|^stamp and signature|^sello y firma|^cachet et signature/i.test(t2))return `<p class="gc-sign-label">${esc(p)}</p>`;

  };
  const clausesHtml=GT.clauses.map(c=>`<div class="gc-c">${c.t?`<span class="gc-h">${esc(c.t)}</span>`:''}${c.b.map(gcPara).join('')}</div>`).join('');
  html+=`<div class="page terms"><div class="pad">
    <div class="plogo">${logoLight(30)}</div>
    <div class="hbar"><div class="l">${t('general_conditions')}</div><div class="r"></div></div>
    <div class="gc-title">${esc(GT.title)}</div>
    <div class="gc-terms">${clausesHtml}</div>
    ${footer()}
  </div></div>`;

  v.innerHTML=`
    <div class="card app-noprint">
      <h2>${t('step_quote')}</h2><p class="hint">${t('hint_quote')}</p>
      <div class="doc-tools">
        <button class="btn prim" id="btnPrint">${t('print_pdf')}</button>
        <button class="btn ghost" id="btnXlsx">${L2('Scarica Excel','Download Excel')}</button>
        <button class="btn prim" id="btnSaveAll" style="background:var(--lx-petrol)">${t('save_all')}</button>
        <span class="fileinfo">${t('filename')}: <b>${esc(suggestedFilename())}.pdf</b></span>

  repaginateQuote();

  $('#btnSaveAll').onclick=saveOfferComplete;

  // inline editing directly in the document preview
  v.querySelectorAll('[data-editname]').forEach(el=>el.addEventListener('blur',()=>{S.solutions[+el.dataset.editname].name=el.textContent.trim();stepQuote();}));
  v.querySelectorAll('[data-editspec]').forEach(el=>el.addEventListener('blur',()=>{const[si,k]=el.dataset.editspec.split('|');S.solutions[+si].specs[k]=el.textContent.trim();stepQuote();}));
  v.querySelectorAll('[data-editlabel]').forEach(el=>el.addEventListener('blur',()=>{const[si,k]=el.dataset.editlabel.split('|');const s=S.solutions[+si];s.specLabels=s.specLabels||{};s.specLabels[k]=el.textContent.trim();stepQuote();}));
  v.querySelectorAll('[data-delspec]').forEach(el=>el.onclick=()=>{const[si,k]=el.dataset.delspec.split('|');const s=S.solutions[+si];s.hiddenSpecs=s.hiddenSpecs||{};s.hiddenSpecs[k]=true;s.specs[k]='';stepQuote();});
  v.querySelectorAll('[data-addextra]').forEach(b=>b.onclick=()=>{const si=+b.dataset.addextra;const s=S.solutions[si];s.extraSpecs=s.extraSpecs||[];s.extraSpecs.push({label:'',text:''});stepQuote();});
  v.querySelectorAll('[data-editextralabel]').forEach(el=>el.addEventListener('blur',()=>{const[si,ei]=el.dataset.editextralabel.split('|').map(Number);S.solutions[si].extraSpecs[ei].label=el.textContent.trim();stepQuote();}));
  v.querySelectorAll('[data-editextratext]').forEach(el=>el.addEventListener('blur',()=>{const[si,ei]=el.dataset.editextratext.split('|').map(Number);S.solutions[si].extraSpecs[ei].text=el.textContent.trim();stepQuote();}));
  v.querySelectorAll('[data-delextra]').forEach(el=>el.onclick=()=>{const[si,ei]=el.dataset.delextra.split('|').map(Number);S.solutions[si].extraSpecs.splice(ei,1);stepQuote();});
  v.querySelectorAll('[data-editmark]').forEach(el=>el.addEventListener('blur',()=>{S.solutions[+el.dataset.editmark].marking=el.textContent.trim();stepQuote();}));
  v.querySelectorAll('[data-editdesc]').forEach(el=>el.addEventListener('blur',()=>{const[si,ri]=el.dataset.editdesc.split('|').map(Number);const s=S.solutions[si];if(ri===0)s.tableDesc=el.textContent.trim();else if(s.accessories[ri-1])s.accessories[ri-1].desc=el.textContent.trim();stepQuote();}));
  v.querySelectorAll('[data-editprice]').forEach(el=>el.addEventListener('blur',()=>{
    const[si,ri]=el.dataset.editprice.split('|').map(Number);const s=S.solutions[si];
    const raw=String(el.textContent).replace(/[^0-9,.-]/g,'');
    const n=parseFloat(raw.replace(/\./g,'').replace(',','.'))||0;
    if(ri===0)s.unit=n;else if(s.accessories[ri-1])s.accessories[ri-1].price=n;
    stepQuote();
  }));
  v.querySelectorAll('[data-addrowimg]').forEach(inp=>inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const[si,ri]=inp.dataset.addrowimg.split('|').map(Number);
    const url=URL.createObjectURL(file);
    const s=S.solutions[si];
    if(ri===0){s.img=url;ensureImgs(s);if(!s.imgs.includes(url))s.imgs.unshift(url);}
    else if(s.accessories[ri-1]){s.accessories[ri-1].img=url;}
    stepQuote();
  });
}
function suggestedFilename(){return (S.offerNum||'OFFER').replace(/[^\w\-]/g,'_')+'_'+(S.client||'CLIENT').replace(/[^\w\-]/g,'_').toUpperCase();}

<script>
/* Configuratore Yacht — modulo "quote-pages": pagine barca e optional del documento, impaginate come il listino Azimut
   (copertina modello con «Caratteristiche principali», poi gli optional per categoria: codice, descrizione, prezzo, immagine). */
const PG_LIMIT=224, PG_HEAD=17, PG_ROW=27, PG_TOT=92;   // mm: spazio utile di una pagina dopo il logo · titolo categoria · riga optional · blocco totali
// descrizione inglese originale del listino (la riga in italiano resta quella principale)
function accEnDesc(s,a){
  if(a.free||!a.code)return '';
  const lists=[typeof machineOptionals==='function'?machineOptionals(s.code):[],...Object.values(MACHINE_OPTIONALS||{})];
  for(const l of lists){const o=(l||[]).find(x=>x.code===a.code);if(o)return o.desc||'';}
  return '';
}
function docSym(){return curInfo(docCur())[1];}
function pgGroupHead(g){return `<div class="op-h"><span class="it">${esc(optGroupLabel(g)).toUpperCase()}</span>&nbsp;/&nbsp;<span class="en">${esc(OPT_GROUP_EN[g]||g).toUpperCase()}</span></div>`;}
function pgRow(r){
  const disc=r.disc&&r.disc!=='0';
  const en=(r.descEn&&r.descEn!==r.desc)?r.descEn:'';
  return `<div class="op-row"><div class="op-t"><b class="op-code">${esc(r.code)}</b><span class="op-d1">${esc(r.desc||'')}</span>${en?`<span class="op-d2">${esc(en)}</span>`:''}</div>
    <div class="op-pr"><b>${moneyD(r.total)}</b>${disc?`<s>${moneyD(r.partial)}</s>`:''}${r.qty>1?`<em>× ${r.qty}</em>`:''}</div>
    <div class="op-img">${r.img?`<img src="${r.img}" alt="">`:IMG_PH}</div></div>`;
}
function pgTotals(sd,pk,showPkg){
  const boat=sd.rows[0],opt=sd.rows.slice(1).reduce((x,r)=>x+r.partial,0);   // a listino: lo sconto si vede nella riga dedicata
  const hasDisc=sd.listTot-sd.solTot>0.005;
  const row=(lbl,val,strong)=>`<div class="tt-row${strong?' strong':''}"><span>${lbl}</span><span>${val}</span></div>`;
  let h='<div class="tt-box">'+row(L2('PREZZO BARCA','BOAT PRICE'),moneyD(boat?boat.partial:0))+row(L2('TOTALE OPTIONAL','TOTAL OF OPTIONALS'),moneyD(opt));
  if(hasDisc)h+=row(L2('SCONTO APPLICATO','DISCOUNT APPLIED'),'−'+moneyD(sd.listTot-sd.solTot));
  h+=row(L2('TOTALE','TOTAL'),moneyD(sd.solTot))+row(L2('IVA (0 %)','VAT (0 %)'),L2('esclusa','excluded'))+row(L2('PREZZO FINALE','FINAL PRICE'),moneyD(sd.solTot),true)+'</div>';
  if(showPkg&&pk.members.length>1)h+=`<div class="tt-box pkg">${row(`${t('order_total')} ${sd.pkg} (${pk.members.map((_,k)=>sd.pkg+String.fromCharCode(65+k)).join(' + ')})`,moneyD(pk.net),true)}</div>`;
  return h;
}
function solutionPagesHtml(sd,pk,isPkgLast,label){
  const {s,rows}=sd;
  const m=!s.custom&&DATA.machines.find(x=>x.code===s.code);
  const hero=(m&&heroOf(m,s.img))||s.img||'';
  const sp=effSpecs(s),boat=rows[0];
  const lbl2=(it,en)=>`<b>${en}</b><i>${it}</i>`;
  const ovRows=[['Motorizzazione kw/mhp','Engines kw/mhp',sp.engine],['Velocità max/crociera','Speed top/cruise',sp.speed],['Lunghezza f.t.','Length overall',sp.loa],['Larghezza max','Max beam',sp.beam],['Cabine','Cabins',sp.cabins]]
    .filter(r=>r[2]!=null&&String(r[2]).trim()!=='')
    .map(r=>`<div class="ov-row"><div class="ov-l">${lbl2(r[0],r[1])}</div><div class="ov-v">${esc(locSpec(r[2]))}</div></div>`).join('')
    +`<div class="ov-row"><div class="ov-l">${lbl2('Prezzi ('+docSym()+')','Prices ('+docSym()+')')}</div><div class="ov-v">${moneyD(boat?boat.partial:0)}</div></div>`;
  const head=`<div class="plogo">${logoLight(30)}</div>`;
  let html=`<div class="page"><div class="pad">${head}
    <div class="sl-eyebrow">${label}</div>
    <div class="sl-title">${esc(s.name)}</div>
    ${hero?`<img class="ov-hero" src="${hero}" alt="">`:''}
    <div class="op-h ov-h"><span class="en">OVERALL CHARACTERISTICS</span>&nbsp;/&nbsp;<span class="it">CARATTERISTICHE PRINCIPALI</span></div>
    <div class="ov-tbl">${ovRows}</div>
    ${footer()}</div></div>`;
  // optional per categoria, in ordine di gruppo; le pagine si riempiono a righe di altezza fissa
  const opts=rows.slice(1);
  const items=[];
  OPT_GROUP_ORDER.forEach(g=>{const rs=opts.filter(r=>(r.group||'Altro')===g);if(rs.length){items.push({h:g});rs.forEach(r=>items.push({r}));}});
  opts.filter(r=>!OPT_GROUP_ORDER.includes(r.group||'Altro')).forEach(r=>items.push({r}));
  const pages=[];let cur=[],used=0;
  const flush=()=>{pages.push(cur);cur=[];used=0;};
  items.forEach((it,i)=>{
    const need=it.h?PG_HEAD+PG_ROW:PG_ROW;                 // un titolo non resta mai solo in fondo alla pagina
    if(used+need>PG_LIMIT&&cur.length)flush();
    cur.push(it);used+=it.h?PG_HEAD:PG_ROW;
  });
  if(cur.length&&used+PG_TOT>PG_LIMIT)flush();            // i totali non entrano: pagina nuova
  const body=its=>its.map(it=>it.h?pgGroupHead(it.h):pgRow(it.r)).join('');
  const last=cur;                                          // l'ultima pagina porta anche i totali
  pages.forEach(p=>{html+=`<div class="page"><div class="pad">${head}<div class="sl-eyebrow">${label}</div>${body(p)}${footer()}</div></div>`;});
  html+=`<div class="page"><div class="pad">${head}<div class="sl-eyebrow">${label}</div>${body(last)}${pgTotals(sd,pk,isPkgLast)}${footer()}</div></div>`;
  return html;
}
</script>
<script>
/* Configuratore Yacht — modulo "export-xlsx": l'offerta in Excel con la stessa impaginazione del catalogo Azimut
   (foglio inglese + foglio «_IT», colonne Qty / Price List / sconto, totali con formule, foglio «service» con i dati strutturati). */
const XL_GREY='FFCCCCCC', XL_ORANGE='FFFFC000';
function xlSheetName(base,used){
  let n=String(base).replace(/^Ferretti Yachts\s*/i,'').replace(/[\\\/?*\[\]:]/g,' ').trim().slice(0,26)||'Offerta';
  let k=n,i=2;while(used.has(k.toLowerCase())){k=n.slice(0,24)+'_'+i++;}
  used.add(k.toLowerCase());return k;
}
function xlFill(cell,argb){cell.fill={type:'pattern',pattern:'solid',fgColor:{argb}};}
function xlAddSheet(wb,sd,lang,name){
  const {s,rows}=sd,it=lang==='it',rate=curRate()||1;
  const L=(a,b)=>it?a:b;
  const sym=curInfo(docCur())[1],fmt=`#,##0.00 "${sym}"`;
  const ws=wb.addWorksheet(name);
  [12,60,5,17,17,20,17,20,20,40].forEach((w,i)=>ws.getColumn(i+1).width=w);
  const sp=effSpecs(s);
  // intestazione modello
  ws.mergeCells('A2:B2');ws.getCell('A2').value=String(s.name).replace(/^Ferretti Yachts\s*/i,'Ferretti ');
  ws.getCell('A2').font={bold:true,size:24};
  'ABCDEFGHIJ'.split('').forEach(c=>xlFill(ws.getCell(c+'2'),XL_GREY));
  ws.getCell('A3').value=L('MOTORI:','ENGINES:');ws.getCell('B3').value=sp.engine||'';
  ws.getCell('F3').value=L('IVA:','VAT:');ws.getCell('G3').value=0;ws.getCell('G3').numFmt='0%';
  ['F3','G3'].forEach(a=>{ws.getCell(a).font={bold:true};xlFill(ws.getCell(a),XL_ORANGE);});
  ws.getCell('A4').value=L('VELOCITÀ','SPEED');ws.getCell('B4').value=sp.speed||'';
  const head=(r,first,title,last)=>{
    const h=['',title,L('Qtà','Qty'),L('Prezzo Listino','Price List'),L('Prezzo esc IVA','Price exc VAT'),L('Prezzo incl IVA','Price Inc VAT'),L('Sconto %','Discount %'),L('Prezzo esc IVA incl Sconto','Price ex VAT incl. Discount'),L('Prezzo incl IVA incl Sconto','Price inc VAT incl. Discount'),last];
    h[0]=first;
    h.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;c.font={bold:true};xlFill(c,XL_GREY);});
  };
  const line=(r,r0,code,desc,qty,unit,disc,note)=>{
    const g=Math.round((disc||0)*10000)/10000;
    const val=unit*qty,vat=val*0,h=val-g*val,ii=h;   // IVA = 0 di partenza (cella G3 modificabile)
    ws.getCell(r,1).value=code||'';ws.getCell(r,2).value=desc||'';ws.getCell(r,2).alignment={wrapText:true,vertical:'top'};
    ws.getCell(r,3).value=qty;ws.getCell(r,4).value=unit;
    ws.getCell(r,5).value={formula:`D${r}*C${r}`,result:val};
    ws.getCell(r,6).value={formula:`E${r}*$G$3+E${r}`,result:val+vat};
    ws.getCell(r,7).value=g;ws.getCell(r,7).numFmt='0.##%';
    ws.getCell(r,8).value={formula:`E${r}-G${r}*E${r}`,result:h};
    ws.getCell(r,9).value={formula:`F${r}-G${r}*F${r}`,result:ii+vat*(1-g)};
    if(note)ws.getCell(r,10).value=note;
    [4,5,6,8,9].forEach(c=>ws.getCell(r,c).numFmt=fmt);
  };
  const dsc=r=>r.partial>0?1-r.total/r.partial:0;
  // barca standard
  head(6,'',L('BARCA STANDARD','STANDARD BOAT'),'');
  const boat=rows[0];
  line(7,7,'',String(s.name).replace(/^Ferretti Yachts\s*/i,'Ferretti '),boat.qty,boat.unit*rate,dsc(boat));
  // optional
  head(9,L('Codice','Code'),L('OPTIONAL','OPTIONALS'),L('Note','Note'));
  let r=11,first=0,lastRow=0;
  const opts=rows.slice(1);
  OPT_GROUP_ORDER.concat(['__altri']).forEach(g=>{
    const rs=opts.filter(x=>g==='__altri'?!OPT_GROUP_ORDER.includes(x.group||'Altro'):(x.group||'Altro')===g);
    if(!rs.length)return;
    ws.getCell(r,2).value=(it?optGroupLabel(g).toUpperCase():(OPT_GROUP_EN[g]||g).toUpperCase());
    for(let c=1;c<=9;c++)xlFill(ws.getCell(r,c),XL_GREY);
    r++;
    rs.forEach(x=>{
      const en=(x.descEn&&x.descEn!==x.desc)?x.descEn:'';
      line(r,0,x.code,it?x.desc:(en||x.desc),x.qty,x.unit*rate,dsc(x));
      if(!first)first=r;lastRow=r;r++;});
  });
  const tot=r+1,grand=tot+4;
  const sumOf=col=>first?{formula:`SUM(${col}${first}:${col}${lastRow})`,result:opts.reduce((x,o)=>x+(col==='H'||col==='I'?o.total:o.partial)*rate,0)}:0;
  ws.getCell(tot,2).value=L('TOTALE OPTIONAL','TOTAL OF OPTIONALS');
  ['E','F','H','I'].forEach(c=>{const cell=ws.getCell(c+tot);cell.value=sumOf(c);cell.numFmt=fmt;});
  const bTot=boat.total*rate,bPar=boat.partial*rate,oTot=opts.reduce((x,o)=>x+o.total*rate,0),oPar=opts.reduce((x,o)=>x+o.partial*rate,0);
  ws.getCell(grand,2).value=L('SOMMA TOTALE','GRAND TOTAL');
  [['E',bPar+oPar],['F',bPar+oPar],['H',bTot+oTot],['I',bTot+oTot]].forEach(([c,v])=>{const cell=ws.getCell(c+grand);cell.value={formula:`${c}7+${c}${tot}`,result:v};cell.numFmt=fmt;});
  [tot,grand].forEach(rr=>{for(let c=1;c<=9;c++){const cell=ws.getCell(rr,c);cell.font={bold:true,size:12};xlFill(cell,XL_GREY);}});
  ws.getCell(grand+2,1).value=L(`Prezzi IVA esclusa. Validità offerta: ${S.validity||'30'} giorni. ${S.incoterm||'Ex Works'}.`,`Prices exclusive of VAT. Offer validity: ${S.validity||'30'} days. ${S.incoterm||'Ex Works'}.`);
  return {tot,grand};
}
// ExcelJS (≈1 MB) si scarica solo quando serve davvero: al primo salvataggio o «Scarica Excel»
let _exceljsP=null;
function loadExcelJS(){
  if(typeof ExcelJS!=='undefined')return Promise.resolve();
  return _exceljsP||(_exceljsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';s.onload=res;s.onerror=()=>{_exceljsP=null;rej(new Error('ExcelJS non scaricato'));};document.head.appendChild(s);}));
}
async function buildOfferXlsx(){
  await loadExcelJS();
  const wb=new ExcelJS.Workbook();wb.creator=(S.rep&&S.rep.name)||BRAND.legalName;wb.created=new Date();
  const {sols}=lineTotals(),used=new Set(),svc=[];
  sols.filter(sd=>!sd.s.sparesOnly).forEach(sd=>{
    const nm=xlSheetName(sd.s.name,used);
    xlAddSheet(wb,sd,'en',nm);
    xlAddSheet(wb,sd,'it',xlSheetName(nm+'_IT',used));
    svc.push(sd);
  });
  if(!svc.length)throw new Error('nessuna imbarcazione da esportare');
  // foglio «service»: dati strutturati (stesso schema usato dai configuratori Azimut), utile per re-importare l'offerta
  const rate=curRate()||1,sd0=svc[0],s0=sd0.s;
  const sections=OPT_GROUP_ORDER.map((g,i)=>({id:i+1,name_en:(OPT_GROUP_EN[g]||g).toUpperCase(),name_local:optGroupLabel(g).toUpperCase(),
    items:sd0.rows.slice(1).filter(x=>(x.group||'Altro')===g).map(x=>({code:x.code,name_en:x.descEn||x.desc,name_local:x.desc,price:x.unit*rate,quantity:x.qty,discount:Math.round(((x.partial>0?1-x.total/x.partial:0))*10000)/10000,price_discount:x.total*rate,market:docCur(),_selected:true}))})).filter(x=>x.items.length);
  const svcData={dealer:(S.rep&&S.rep.email)||'',offerNum:S.offerNum,listino:S.listino||'EUR',
    boatModel:{name:s0.name,code:s0.code,engines:effSpecs(s0).engine||'',speed:effSpecs(s0).speed||'',price:sd0.rows[0].unit*rate,market:docCur(),discount:0},
    boatSections:sections,currentVAT:0,customBoatPrice:0};
  wb.addWorksheet('service').getCell('A1').value=JSON.stringify(svcData);
  const buf=await wb.xlsx.writeBuffer();
  return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function downloadOfferXlsx(){
  try{
    const blob=await buildOfferXlsx();
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=suggestedFilename()+'.xlsx';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  }catch(e){console.error(e);flash(L2('Excel non generato: ','Excel not generated: ')+(e&&e.message||e),4000);}
}
</script>
<script>
/* Configuratore Yacht — modulo "router" */
/* ============== ROUTER ============== */
function render(){
  if(typeof DASH!=='undefined'&&DASH){renderDashboard();window.scrollTo(0,0);return;}
  maxReached=Math.max(maxReached,step);
  renderStepper();
  try{[stepCustomer,stepProduct,stepOptions,stepQuote][step]();}
  catch(err){
    console.error(err);
    $('#view').innerHTML=`<div class="card"><h2>⚠ Errore nel passaggio ${step+1}</h2><p class="hint">${esc(String(err&&err.message||err))}</p>
      <pre style="white-space:pre-wrap;font-size:11px;color:#8c1412">${esc(String(err&&err.stack||''))}</pre></div>`;
  }

function handleClients(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=sheetRows(sheet,['azienda','company','ragione sociale','cliente','nome','name','ragione']);
      if(!rows.length){flash(t('clients_empty'));return;}
      // figure out which header holds what, ONCE, from the keys
      const keys=Object.keys(rows[0]);
